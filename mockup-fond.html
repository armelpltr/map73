<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : fonds du hero</title>
<style>
  /* Maquette : la page d'accueil, chargee dans un cadre, avec le neon
     bicolore retenu et cinq fonds de hero a comparer. Chaque fond s'efface
     en bas du hero, pour ne pas recreer de limite avec la section suivante. */
  :root {
    --nuit: #050b16;
    --panneau: #12213c;
    --trait: #1b2c47;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
    --choisi: #6cc24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.5rem;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; }
  .choix { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .option {
    padding: 0.45rem 0.9rem;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .option:hover { border-color: var(--doux); }
  .option[aria-pressed="true"] { border-color: var(--choisi); }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }
  .fiche { width: 100%; margin: 0; color: var(--doux); font-size: 0.85rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }
  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--nuit); }
  .scene--mobile iframe { width: 390px; border-left: 1px solid var(--trait); border-right: 1px solid var(--trait); }
  @media (max-width: 700px) { .reglages { margin-left: 0; } }
</style>
</head>
<body>

<header class="barre">
  <h1>Néon bicolore : cinq fonds</h1>
  <div class="choix" id="choix"></div>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="index.html" title="Page d'accueil avec le fond choisi"></iframe>
</div>

<script>
  /* Le neon bicolore, retenu : la carte du choix de classe en tube bleu
     electrique, « un avenir. » en tube vert. Il est identique dans toutes
     les propositions ; seul le fond change. Les animations portent
     !important et une specificite plus forte que la regle « mouvement
     reduit » du site, pour qu'on les voie dans la maquette sur un poste qui
     les fige ; le site final, lui, les arretera pour ceux qui l'ont demande. */
  const BLEU = "#2f8cff", BLEU_COEUR = "#d6e9ff", VERT = "#6cc24a", VERT_COEUR = "#e2ffd6";
  const halo = (c) => `0 0 2px ${c}, 0 0 8px ${c}, 0 0 22px ${c}, 0 0 48px ${c}88`;

  const COMMUN = `
    .hero__lucioles, .hero::after { display: none; }
    .hero .mq-fond {
      position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
    }
    .hero .mq-fond *, .hero .mq-fond *::before, .hero .mq-fond *::after, .hero .mq-anime {
      animation-duration: var(--d, 10s) !important;
      animation-iteration-count: infinite !important;
    }
    /* La lumiere que les deux tubes jettent sur le fond. */
    .mq-lueur {
      position: absolute; inset: 0; z-index: 1;
      background:
        radial-gradient(560px 380px at 74% 34%, ${BLEU}26, transparent 70%),
        radial-gradient(520px 300px at 26% 52%, ${VERT}14, transparent 70%);
    }
    .hero .hero__classe.mq-anime {
      position: relative; padding: 1.75rem; border-radius: 26px;
      border: 2px solid ${BLEU_COEUR};
      background: rgba(5, 11, 22, .6);
      box-shadow: ${halo(BLEU)}, inset 0 0 14px ${BLEU}88;
      --d: 9s; animation: mq-gresille steps(1);
    }
    .hero .hero__classe.mq-anime .hero__classe-rond { border-color: ${BLEU_COEUR}; box-shadow: 0 0 2px ${BLEU}, 0 0 10px ${BLEU}, inset 0 0 8px ${BLEU}88; }
    .hero .hero__classe.mq-anime .hero__classe-bouton { border-color: ${BLEU}; box-shadow: 0 0 10px ${BLEU}55; }
    .hero .hero__accent.mq-anime {
      color: transparent; -webkit-text-stroke: 2px ${VERT_COEUR};
      filter: drop-shadow(0 0 2px ${VERT}) drop-shadow(0 0 7px ${VERT}) drop-shadow(0 0 18px ${VERT});
      --d: 7s; animation: mq-gresille steps(1); animation-delay: -4s;
    }
    @media (max-width: 700px) { .hero .hero__accent.mq-anime { -webkit-text-stroke-width: 1.5px; } }
    @keyframes mq-gresille {
      0%, 90%, 100% { opacity: 1; }
      91% { opacity: .45; } 92% { opacity: 1; } 94% { opacity: .65; } 95% { opacity: 1; }
    }`;

  /* Le mur de briques, en motif SVG : deux rangees decalees de briques a
     peine plus claires que le marine, sur un joint plus sombre. */
  const BRIQUES = "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64">
      <rect width="96" height="64" fill="#040912"/>
      <rect x="1" y="1" width="46" height="30" rx="2" fill="#1a2e4b"/>
      <rect x="49" y="1" width="46" height="30" rx="2" fill="#172a44"/>
      <rect x="-23" y="33" width="46" height="30" rx="2" fill="#172a44"/>
      <rect x="25" y="33" width="46" height="30" rx="2" fill="#1c304e"/>
      <rect x="73" y="33" width="46" height="30" rx="2" fill="#172a44"/>
    </svg>`);

  const DESIGNS = [
    {
      nom: "1 · Mur de briques",
      note: "Le néon accroché à un vrai mur, comme une enseigne : des briques sombres, éclairées en bleu autour de la carte et en vert sous le titre, et noyées dans l'ombre ailleurs.",
      html: `<span class="mq-briques"></span><span class="mq-lueur"></span>`,
      css: `
        .mq-briques {
          position: absolute; inset: 0;
          background: url("${BRIQUES}") 0 0 / 96px 64px;
          -webkit-mask-image: radial-gradient(90% 85% at 55% 40%, #000, rgba(0,0,0,.25) 85%);
          mask-image: radial-gradient(90% 85% at 55% 40%, #000, rgba(0,0,0,.25) 85%);
        }
        .hero .mq-fond .mq-lueur { mix-blend-mode: screen; background:
          radial-gradient(560px 380px at 74% 34%, ${BLEU}40, transparent 70%),
          radial-gradient(520px 300px at 26% 52%, ${VERT}26, transparent 70%); }`,
    },
    {
      nom: "2 · Circuit",
      note: "Des pistes de circuit imprimé à angles droits et à 45°, où des impulsions vertes et bleues circulent : les chemins possibles, version électronique.",
      html: `<svg class="mq-circuit" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice"></svg><span class="mq-lueur"></span>`,
      css: `
        .mq-circuit { position: absolute; inset: 0; width: 100%; height: 100%; }
        .mq-circuit .piste { fill: none; stroke: rgba(116,198,234,.13); stroke-width: 1.5; }
        .mq-circuit .pastille { fill: #0b1a2e; stroke: rgba(116,198,234,.3); stroke-width: 1.5; }
        .mq-circuit .impulsion {
          fill: none; stroke-width: 2.5; stroke-linecap: round;
          stroke-dasharray: 26 1400; animation: mq-courant linear;
        }
        @keyframes mq-courant { from { stroke-dashoffset: 1426; } to { stroke-dashoffset: 0; } }`,
      script: circuit,
    },
    {
      nom: "3 · Brume",
      note: "Une fumée lente qui traverse le hero et attrape la lumière des tubes, comme un néon dans une salle embrumée. Le plus atmosphérique.",
      html: `<svg class="mq-brume" preserveAspectRatio="none" viewBox="0 0 1440 760">
          <filter id="mq-fumee" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.009" numOctaves="4" seed="7">
              <animate attributeName="baseFrequency" dur="40s" values="0.0035 0.009;0.0045 0.011;0.0035 0.009" repeatCount="indefinite"/>
            </feTurbulence>
            <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.74  0 0 0 0 0.9  0 0 0 1.25 -0.5"/>
          </filter>
          <rect class="mq-fumee" width="2880" height="760" filter="url(#mq-fumee)"/>
        </svg><span class="mq-lueur"></span>`,
      css: `
        .mq-brume { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; }
        .mq-fumee { --d: 60s; animation: mq-vent linear; }
        @keyframes mq-vent { to { transform: translateX(-1440px); } }
        .hero .mq-fond .mq-lueur { background:
          radial-gradient(620px 420px at 74% 34%, ${BLEU}33, transparent 70%),
          radial-gradient(560px 320px at 26% 52%, ${VERT}1f, transparent 70%); }`,
    },
    {
      nom: "4 · Horizon",
      note: "Le sol quadrillé en perspective de la première maquette, cette fois en bleu sous les néons : l'ambiance synthwave, un chemin qui avance vers vous.",
      html: `<span class="mq-horizon"></span><span class="mq-sol"></span><span class="mq-lueur"></span>`,
      css: `
        .hero .mq-fond {
          -webkit-mask-image: linear-gradient(to bottom, #000 84%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 84%, transparent 100%);
        }
        .mq-sol {
          position: absolute; left: -50%; right: -50%; top: 50%; height: 120%;
          background-image:
            linear-gradient(${BLEU}99 1px, transparent 1px),
            linear-gradient(90deg, ${BLEU}99 1px, transparent 1px);
          background-size: 64px 64px;
          transform: perspective(400px) rotateX(72deg); transform-origin: 50% 0;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 25%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 25%);
          opacity: .5; --d: 2.4s; animation: mq-defile linear;
        }
        @keyframes mq-defile { to { background-position: 0 64px; } }
        .mq-horizon {
          position: absolute; left: 0; right: 0; top: 50%; height: 220px; transform: translateY(-50%);
          background: radial-gradient(50% 50% at 50% 50%, ${BLEU}33, transparent 70%);
        }`,
    },
    {
      nom: "5 · Filantes",
      note: "Des traits de lumière bleus et verts qui filent en diagonale, à des vitesses différentes : du mouvement, de la vitesse, sans rien de figé derrière le texte.",
      html: `<span class="mq-filantes"></span><span class="mq-lueur"></span>`,
      css: `
        .mq-trait {
          position: absolute; top: -20%; height: 1.5px; width: 260px; border-radius: 2px;
          transform: rotate(-32deg);
          animation: mq-file linear; opacity: 0;
        }
        @keyframes mq-file {
          0%   { opacity: 0; translate: 0 0; }
          10%  { opacity: 1; }
          70%  { opacity: 1; }
          100% { opacity: 0; translate: -900px 560px; }
        }`,
      script: filantes,
    },
  ];

  /* Le circuit : des pistes tirees au hasard (graine fixe, pour que la
     maquette soit la meme a chaque chargement), chacune parcourue par une
     impulsion. */
  function circuit(doc, win, calque) {
    const svg = calque.querySelector("svg");
    let graine = 11;
    const hasard = () => ((graine = (graine * 16807) % 2147483647) / 2147483647);
    let html = "";
    for (let i = 0; i < 26; i++) {
      const gauche = i % 2 === 0;
      let x = gauche ? -10 : 1450;
      let y = 40 + hasard() * 680;
      let d = `M${x} ${y}`;
      const sens = gauche ? 1 : -1;
      for (let s = 0; s < 3; s++) {
        x += sens * (80 + hasard() * 240); d += ` H${x}`;
        const dy = (hasard() < 0.5 ? -1 : 1) * (30 + hasard() * 70);
        x += sens * Math.abs(dy); y += dy; d += ` L${x} ${y}`;
      }
      x += sens * (40 + hasard() * 120); d += ` H${x}`;
      const couleur = hasard() < 0.5 ? "#6cc24a" : "#74c6ea";
      const duree = (5 + hasard() * 7).toFixed(1);
      const delai = (-hasard() * 12).toFixed(1);
      html += `<path class="piste" d="${d}"/>`;
      html += `<path class="impulsion" d="${d}" stroke="${couleur}" style="--d:${duree}s;animation-delay:${delai}s;filter:drop-shadow(0 0 4px ${couleur})"/>`;
      html += `<circle class="pastille" cx="${x}" cy="${y}" r="4"/>`;
    }
    svg.innerHTML = html;
  }

  /* Les etoiles filantes : des traits places au hasard, chacun avec sa
     vitesse et son retard. */
  function filantes(doc, win, calque) {
    const boite = calque.querySelector(".mq-filantes");
    let html = "";
    for (let i = 0; i < 16; i++) {
      const couleur = i % 3 === 0 ? "#6cc24a" : "#2f8cff";
      const gauche = 15 + Math.random() * 100;
      const duree = (3 + Math.random() * 4).toFixed(1);
      const delai = (-Math.random() * 7).toFixed(1);
      html += `<span class="mq-trait" style="left:${gauche}%;--d:${duree}s;animation-delay:${delai}s;` +
        `background:linear-gradient(90deg, ${couleur}, transparent);box-shadow:0 0 8px ${couleur}"></span>`;
    }
    boite.innerHTML = html;
  }

  const cadre = document.getElementById("site");
  const scene = document.getElementById("scene");
  const fiche = document.getElementById("fiche");
  const conteneur = document.getElementById("choix");
  const depart = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), DESIGNS.length) - 1;
  let courant = DESIGNS[depart];

  function peindre() {
    const doc = cadre.contentDocument;
    const win = cadre.contentWindow;
    const hero = doc && doc.querySelector(".hero");
    if (!hero) return;
    let style = doc.getElementById("maquette-fond");
    if (!style) {
      style = doc.createElement("style");
      style.id = "maquette-fond";
      doc.head.appendChild(style);
    }
    style.textContent = COMMUN + courant.css;
    doc.querySelectorAll(".hero__classe, .hero__accent").forEach((el) => el.classList.add("mq-anime"));
    let calque = hero.querySelector(".mq-fond");
    if (calque) calque.remove();
    calque = doc.createElement("div");
    calque.className = "mq-fond";
    calque.setAttribute("aria-hidden", "true");
    calque.innerHTML = courant.html;
    hero.prepend(calque);
    if (courant.script) courant.script(doc, win, calque);
  }

  function choisir(d) {
    courant = d;
    history.replaceState(null, "", "#" + (DESIGNS.indexOf(d) + 1));
    conteneur.querySelectorAll(".option").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.nom === d.nom)));
    fiche.innerHTML = `<strong>${d.nom}.</strong> ${d.note}`;
    peindre();
  }

  DESIGNS.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.dataset.nom = d.nom;
    b.textContent = d.nom;
    b.addEventListener("click", () => choisir(d));
    conteneur.appendChild(b);
  });

  document.querySelectorAll("[data-largeur]").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-largeur]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      scene.classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
    });
  });

  cadre.addEventListener("load", peindre);
  choisir(courant);
</script>
</body>
</html>
