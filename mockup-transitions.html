<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : diagonales et arcs</title>
<style>
  /* Maquette de travail, hors site : elle charge la vraie page d'accueil et
     remplace les vagues (.couture) entre les sections marine et creme par
     l'une des jointures ci-dessous. Le site en ligne n'est pas
     touche. */
  :root {
    --nuit: #0b1a2e;
    --panneau: #1f2c3f;
    --trait: #2d3a4b;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
    --vert: #94c412;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem 1.25rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.35rem 0.75rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }

  .choix {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.4rem;
    width: 100%;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.3rem 0.5rem 0.3rem 0.3rem;
    border: 2px solid var(--trait);
    border-radius: 8px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.78rem;
    text-align: left;
    cursor: pointer;
  }
  .option:hover { border-color: var(--doux); }
  .option[aria-pressed="true"] { border-color: var(--vert); }
  /* L'apercu : un bout de marine, la jointure en petit, un bout de creme. */
  .apercu {
    display: flex;
    flex-direction: column;
    flex: none;
    width: 44px;
    height: 34px;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #3a4b66;
    --couture-sortant: #0b1a2e;
    --couture-entrant: #f0e2c2;
    --k: 0.22;
  }
  .apercu__haut { flex: 1; background: var(--couture-sortant); }
  .apercu__bas { flex: 1; background: var(--couture-entrant); }
  .option__nom { line-height: 1.2; }

  .fiche { width: 100%; margin: 0; color: var(--doux); font-size: 0.8rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }

  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--nuit); }
  .scene--mobile iframe { width: 390px; }
  @media (max-width: 700px) {
    .reglages { margin-left: 0; }
    .choix { grid-template-columns: repeat(2, 1fr); }
  }
</style>
<style id="jointures">
  /* Les jointures, partagees par les apercus et par la page. Chacune part
     de la couleur sortante (le fond de la .couture) et dessine la couleur
     entrante par-dessus, dans un ::before. --h est sa hauteur sur la page ;
     --k la reduit dans les apercus. */
  .couture.mq {
    --v: #94c412;
    position: relative;
    display: block;
    height: calc(var(--h, 60px) * var(--k, 1)) !important;
    margin-bottom: -1px;
    background: var(--couture-sortant);
    overflow: hidden;
  }
  .couture.mq svg { display: none; }
  .couture.mq::before,
  .couture.mq::after { content: ""; position: absolute; }
  .couture.mq::before { inset: 0; background: var(--couture-entrant); }
  .couture.mq.couture--miroir::before,
  .couture.mq.couture--miroir::after { transform: scaleX(-1); }

  /* Seules restent les coupes amples, d'un seul geste : diagonales et
     arcs. Le vert n'y entre qu'en filet, sur deux d'entre elles. */

  /* La diagonale de reference, et ses variantes */
  .mq[data-mq="diagonale"] { --h: 90px; }
  .mq[data-mq="diagonale"]::before { clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  .mq[data-mq="pente"] { --h: 36px; }
  .mq[data-mq="pente"]::before { clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  .mq[data-mq="raide"] { --h: 150px; }
  .mq[data-mq="raide"]::before { clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  /* Une diagonale qui change d'angle aux deux tiers */
  .mq[data-mq="brisee"] { --h: 90px; }
  .mq[data-mq="brisee"]::before { clip-path: polygon(0 100%, 65% 55%, 100% 0, 100% 100%); }
  /* Deux plans : une pente pleine, et devant elle une pente plus raide a
     demi-teinte */
  .mq[data-mq="facettes"] { --h: 90px; }
  .mq[data-mq="facettes"]::before { clip-path: polygon(0 100%, 100% 45%, 100% 100%); }
  .mq[data-mq="facettes"]::after { inset: 0; background: var(--couture-entrant); opacity: 0.45; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  /* La diagonale, bordee d'un filet vert */
  .mq[data-mq="diagonale-verte"] { --h: 90px; }
  .mq[data-mq="diagonale-verte"]::before { clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  .mq[data-mq="diagonale-verte"]::after { inset: 0; background: var(--v); clip-path: polygon(0 calc(100% - 4px), 100% -4px, 100% 0, 0 100%); }

  /* L'arc de reference, et ses variantes */
  .mq[data-mq="arc"] { --h: 60px; }
  .mq[data-mq="arc"]::before { clip-path: ellipse(75% 100% at 50% 100%); }
  .mq[data-mq="arc-plat"] { --h: 30px; }
  .mq[data-mq="arc-plat"]::before { clip-path: ellipse(80% 100% at 50% 100%); }
  .mq[data-mq="arc-decentre"] { --h: 70px; }
  .mq[data-mq="arc-decentre"]::before { clip-path: ellipse(110% 100% at 25% 100%); }
  /* L'arc retourne : la section sortante s'arrondit vers le bas */
  .mq[data-mq="arc-creuse"] { --h: 60px; }
  .mq[data-mq="arc-creuse"]::before {
    -webkit-mask: radial-gradient(75% 100% at 50% 0, transparent 99%, #000 100%);
            mask: radial-gradient(75% 100% at 50% 0, transparent 99%, #000 100%);
  }
  /* L'arc, souligne d'un filet vert */
  .mq[data-mq="arc-vert"] { --h: 60px; }
  .mq[data-mq="arc-vert"]::before { background: var(--v); clip-path: ellipse(75% 100% at 50% 100%); }
  .mq[data-mq="arc-vert"]::after { inset: calc(4px * var(--k, 1)) 0 0; background: var(--couture-entrant); clip-path: ellipse(75% 100% at 50% 100%); }
  /* Un seul angle arrondi, le reste plat */
  .mq[data-mq="angle"] { --h: 80px; }
  .mq[data-mq="angle"]::before { border-top-left-radius: 45% 100%; }
  /* Une pente qui se creuse : la diagonale devenue courbe */
  .mq[data-mq="pente-courbe"] { --h: 90px; }
  .mq[data-mq="pente-courbe"]::after { inset: 0; background: var(--couture-sortant); border-bottom-right-radius: 100% 100%; }
</style>
</head>
<body>

<header class="barre">
  <h1>Transitions : diagonales et arcs</h1>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <div class="choix" id="choix"></div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="index.html" title="Page d'accueil avec la transition choisie"></iframe>
</div>

<script>
  /* La 0 est la page telle qu'elle est en ligne, pour comparer. */
  const JOINTURES = [
    { id: "vagues", nom: "Actuel : vagues", note: "Le site en ligne aujourd'hui, pour comparer." },
    { id: "diagonale", nom: "Diagonale", note: "Retenue : coupe en biais franche, alternée d'un côté à l'autre." },
    { id: "pente", nom: "Pente douce", note: "Retenue : la même diagonale, très couchée." },
    { id: "arc", nom: "Arc", note: "Retenu : une seule courbe ample et régulière." },
    { id: "raide", nom: "Pente raide", note: "La diagonale à 150 px : plus dynamique, plus affirmée." },
    { id: "brisee", nom: "Diagonale brisée", note: "La pente change d'angle aux deux tiers : un pli, comme une page." },
    { id: "facettes", nom: "Facettes", note: "Deux pentes superposées, la seconde en demi-teinte : du relief." },
    { id: "diagonale-verte", nom: "Diagonale verte", note: "La diagonale bordée d'un filet vert : le vert du logo trace la coupe." },
    { id: "arc-plat", nom: "Arc plat", note: "L'arc très couché : la courbe se devine plus qu'elle ne se voit." },
    { id: "arc-decentre", nom: "Arc décentré", note: "Le sommet de l'arc part à gauche : moins symétrique, plus vivant." },
    { id: "arc-creuse", nom: "Arc creusé", note: "L'arc retourné : la section qui s'achève s'arrondit vers le bas." },
    { id: "arc-vert", nom: "Arc vert", note: "L'arc souligné d'un filet vert." },
    { id: "angle", nom: "Angle arrondi", note: "Un seul coin arrondi, le reste à plat : discret, doux." },
    { id: "pente-courbe", nom: "Pente courbe", note: "Une diagonale qui se creuse en courbe, comme une piste." },
  ];

  let jointure;
  const cadre = document.getElementById("site");

  function peindre() {
    const doc = cadre.contentDocument;
    if (doc && doc.head && doc.querySelector(".couture")) {
      if (!doc.getElementById("mq-jointures")) {
        const style = doc.createElement("style");
        style.id = "mq-jointures";
        style.textContent = document.getElementById("jointures").textContent;
        doc.head.appendChild(style);
      }
      doc.querySelectorAll(".couture").forEach((c) => {
        const vagues = jointure.id === "vagues";
        c.classList.toggle("mq", !vagues);
        if (vagues) delete c.dataset.mq;
        else c.dataset.mq = jointure.id;
      });
    }
    document.querySelectorAll(".option").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.id === jointure.id)));
    document.getElementById("fiche").innerHTML = `<strong>${jointure.nom}</strong> — ${jointure.note}`;
  }

  const liste = document.getElementById("choix");
  JOINTURES.forEach((j, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.dataset.id = j.id;
    b.title = j.note;
    const coupe = j.id === "vagues"
      ? `<svg class="apercu__vague" viewBox="0 0 44 8" preserveAspectRatio="none" style="display:block;width:100%;height:8px;background:#0b1a2e"><path d="M0 5C8 1 16 8 24 5S38 1 44 3V8H0Z" fill="#f0e2c2"/></svg>`
      : `<span class="couture mq" data-mq="${j.id}"></span>`;
    b.innerHTML =
      `<span class="apercu"><span class="apercu__haut"></span>${coupe}<span class="apercu__bas"></span></span>` +
      `<span class="option__nom">${i}. ${j.nom}</span>`;
    b.addEventListener("click", () => { location.hash = String(i); });
    liste.appendChild(b);
  });

  // mockup-transitions.html#6 ouvre directement sur la jointure 6. Un lien
  // vers un autre numero ne change que le #, sans recharger : on le suit.
  const lireHash = () => {
    jointure = JOINTURES[Number(location.hash.slice(1))] || JOINTURES[0];
    peindre();
  };
  window.addEventListener("hashchange", lireHash);
  lireHash();
  cadre.addEventListener("load", peindre);

  document.querySelectorAll(".reglage").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".reglage").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      document.getElementById("scene").classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
    });
  });
</script>
</body>
</html>
