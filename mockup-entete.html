<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : en-tête</title>
<style>
  /* Maquette : la page d'accueil, chargee dans un cadre, avec cinq
     en-tetes a comparer, accordes au hero neon. */
  :root {
    --nuit: #050b16;
    --panneau: #12213c;
    --trait: #1b2c47;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
    --choisi: #6cc24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.5rem;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; }
  .choix { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .option {
    padding: 0.45rem 0.9rem;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .option:hover { border-color: var(--doux); }
  .option[aria-pressed="true"] { border-color: var(--choisi); }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }
  .fiche { width: 100%; margin: 0; color: var(--doux); font-size: 0.85rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }
  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--nuit); }
  .scene--mobile iframe { width: 390px; border-left: 1px solid var(--trait); border-right: 1px solid var(--trait); }
  @media (max-width: 700px) { .reglages { margin-left: 0; } }
</style>
</head>
<body>

<header class="barre">
  <h1>Cinq en-têtes</h1>
  <div class="choix" id="choix"></div>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="index.html" title="Page d'accueil avec l'en-tête choisi"></iframe>
</div>

<script>
  /* Cinq en-tetes pour aller avec le hero neon. Seul le bandeau du haut
     change. Faites defiler la page dans le cadre : chaque proposition a
     aussi sa tenue compacte, celle que prend le bandeau des qu'on quitte le
     haut de page. Les animations portent !important et une specificite plus
     forte que la regle « mouvement reduit » du site, pour qu'on les voie
     dans la maquette sur un poste qui les fige. */
  const BLEU = "#2f8cff", BLEU_COEUR = "#d6e9ff", VERT = "#6cc24a", VERT_COEUR = "#e2ffd6";
  const halo = (c) => `0 0 2px ${c}, 0 0 8px ${c}, 0 0 22px ${c}`;

  const COMMUN = `
    html body .entete .mq-anime, html body .entete.mq-anime::after {
      animation-duration: var(--d, 6s) !important;
      animation-iteration-count: infinite !important;
    }`;

  /* Le liseré du bas : une ligne de lumiere qui s'eteint aux deux bouts. */
  const LISERE = `
    .entete::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, ${BLEU} 25%, ${VERT_COEUR} 50%, ${VERT} 75%, transparent);
      box-shadow: 0 0 8px ${BLEU}, 0 0 18px ${BLEU}66;
    }`;

  /* Le bouton d'appel en tube neon vert, et le menu en tube bleu. */
  const BOUTONS_NEON = `
    .entete .entete__appel {
      background: transparent; color: ${VERT_COEUR};
      border: 2px solid ${VERT_COEUR};
      box-shadow: ${halo(VERT)}, inset 0 0 8px ${VERT}88;
      text-shadow: 0 0 6px ${VERT};
    }
    .entete .entete__appel:hover { background: ${VERT}; color: #14243b; text-shadow: none; }
    .entete .entete__bascule {
      border: 2px solid ${BLEU_COEUR}; color: ${BLEU_COEUR};
      box-shadow: 0 0 2px ${BLEU}, 0 0 10px ${BLEU}, inset 0 0 6px ${BLEU}88;
    }`;

  const DESIGNS = [
    {
      nom: "1 · Fondu + liseré",
      note: "Le bandeau prend le marine de la page : il ne fait plus bande à part. Seul un liseré de lumière bleu → vert le sépare du hero. En défilant, il devient translucide et floute ce qui passe dessous.",
      css: `
        .entete { background: #0b1a2e; border-bottom: 0; }
        .entete[data-defile="oui"] {
          background: rgba(11, 26, 46, .72);
          -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
          box-shadow: none;
        }
        ${LISERE}`,
    },
    {
      nom: "2 · Enseigne",
      note: "Le bandeau reste marine, souligné d'un vrai tube néon bleu. Le bouton d'appel devient un tube vert et le menu un tube bleu : l'en-tête reprend exactement les deux néons du hero.",
      css: `
        .entete { background: #0b1a2e; border-bottom: 0; }
        .entete::after {
          content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px;
          background: ${BLEU_COEUR};
          box-shadow: ${halo(BLEU)};
        }
        .entete[data-defile="oui"] { background: rgba(11, 26, 46, .8); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: none; }
        ${BOUTONS_NEON}`,
    },
    {
      nom: "3 · Capsule flottante",
      note: "Plus de bandeau pleine largeur : le logo, l'appel et le menu flottent dans une capsule en verre, cerclée d'un néon bleu, détachée du haut de l'écran. Très « interface du futur ».",
      css: `
        .entete, .entete[data-defile="oui"] { background: transparent; border-bottom: 0; box-shadow: none; }
        .entete .entete__barre {
          margin-top: 12px;
          padding-inline: clamp(1rem, 2.5vw, 1.75rem);
          border-radius: 999px;
          background: rgba(5, 11, 22, .62);
          -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
          border: 1.5px solid ${BLEU_COEUR};
          box-shadow: 0 0 2px ${BLEU}, 0 0 10px ${BLEU}, 0 0 26px ${BLEU}66, inset 0 0 10px ${BLEU}55;
        }
        @media (max-width: 700px) { .entete .entete__barre { margin-top: 8px; width: calc(100% - 16px); } }`,
    },
    {
      nom: "4 · Verre",
      note: "Le plus sobre : un verre dépoli marine à peine teinté, avec un filet clair très fin. Sous le hero il se fond dans la page ; en défilant, le contenu passe flouté dessous.",
      css: `
        .entete {
          background: rgba(11, 26, 46, .55);
          -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
          border-bottom: 1px solid rgba(214, 233, 255, .09);
        }
        .entete[data-defile="oui"] { background: rgba(11, 26, 46, .6); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
        .entete .entete__bascule { border-color: rgba(214, 233, 255, .22); }`,
    },
    {
      nom: "5 · Scanner",
      note: "Comme le fondu, mais une pointe de lumière parcourt le liseré de gauche à droite, en boucle, comme un scanner. Le bouton d'appel est en tube vert.",
      css: `
        .entete { background: #0b1a2e; border-bottom: 0; }
        .entete[data-defile="oui"] { background: rgba(11, 26, 46, .72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: none; }
        .entete::before {
          content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
          background: linear-gradient(90deg, transparent, ${BLEU}66 20%, ${BLEU}66 80%, transparent);
        }
        .entete.mq-anime::after {
          content: ""; position: absolute; bottom: -2px; left: 0; height: 3px; width: 220px;
          border-radius: 3px;
          background: linear-gradient(90deg, transparent, ${BLEU}, ${VERT_COEUR}, ${VERT}, transparent);
          box-shadow: 0 0 10px ${BLEU}, 0 0 22px ${VERT};
          --d: 4.5s; animation: mq-scan ease-in-out;
        }
        @keyframes mq-scan {
          0%   { transform: translateX(-240px); }
          100% { transform: translateX(100vw); }
        }
        .entete .entete__appel {
          background: transparent; color: ${VERT_COEUR};
          border: 2px solid ${VERT_COEUR};
          box-shadow: ${halo(VERT)}, inset 0 0 8px ${VERT}88;
          text-shadow: 0 0 6px ${VERT};
        }
        .entete .entete__appel:hover { background: ${VERT}; color: #14243b; text-shadow: none; }`,
    },
  ];

  const cadre = document.getElementById("site");
  const scene = document.getElementById("scene");
  const fiche = document.getElementById("fiche");
  const conteneur = document.getElementById("choix");
  const depart = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), DESIGNS.length) - 1;
  let courant = DESIGNS[depart];

  function peindre() {
    const doc = cadre.contentDocument;
    const entete = doc && doc.querySelector(".entete");
    if (!entete) return;
    let style = doc.getElementById("maquette-entete");
    if (!style) {
      style = doc.createElement("style");
      style.id = "maquette-entete";
      doc.head.appendChild(style);
    }
    style.textContent = COMMUN + courant.css;
    entete.classList.add("mq-anime");
  }

  function choisir(d) {
    courant = d;
    history.replaceState(null, "", "#" + (DESIGNS.indexOf(d) + 1));
    conteneur.querySelectorAll(".option").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.nom === d.nom)));
    fiche.innerHTML = `<strong>${d.nom}.</strong> ${d.note} <em>Faites défiler la page pour voir la version compacte.</em>`;
    peindre();
  }

  DESIGNS.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.dataset.nom = d.nom;
    b.textContent = d.nom;
    b.addEventListener("click", () => choisir(d));
    conteneur.appendChild(b);
  });

  document.querySelectorAll("[data-largeur]").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-largeur]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      scene.classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
    });
  });

  cadre.addEventListener("load", peindre);
  choisir(courant);
</script>
</body>
</html>
