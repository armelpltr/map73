<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : cartes</title>
<style>
  /* Maquette : la page d'accueil, chargee dans un cadre, avec quatre
     modeles de cartes repris de goblackmoon.com. */
  :root {
    --nuit: #050b16;
    --panneau: #12213c;
    --trait: #1b2c47;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
    --choisi: #6cc24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.5rem;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; }
  .choix { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .option {
    padding: 0.45rem 0.9rem;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .option:hover { border-color: var(--doux); }
  .option[aria-pressed="true"] { border-color: var(--choisi); }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }
  .fiche { width: 100%; margin: 0; color: var(--doux); font-size: 0.85rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }
  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--nuit); }
  .scene--mobile iframe { width: 390px; border-left: 1px solid var(--trait); border-right: 1px solid var(--trait); }
  @media (max-width: 700px) { .reglages { margin-left: 0; } }
</style>
</head>
<body>

<header class="barre">
  <h1>Cartes façon Blackmoon</h1>
  <div class="choix" id="choix"></div>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="about:blank" title="Page d’accueil avec les cartes choisies"></iframe>
</div>

<script>
  /* Quatre cartes reprises de goblackmoon.com, transposees dans la palette
     du site : chacune s'applique a la section ou elle a le plus de sens,
     et la page defile jusqu'a elle. « Avant » montre la section telle
     qu'en ligne. Les transitions portent !important et une specificite
     plus forte que la regle « mouvement reduit » du site, pour qu'on les
     voie dans la maquette sur un poste qui les fige. */
  const VERT = "#6cc24a", BLEU = "#2f8cff", LAC = "#74c6ea", AMBRE = "#e8a33d", MARINE = "#0b1a2e", CREME = "#f7f6f1";
  const FLECHE = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>`;
  const PORTRAITS = `<span class="mq-avatars"><img src="assets/img/portrait-camille.webp" alt=""><img src="assets/img/portrait-julie.webp" alt=""></span>`;

  const DESIGNS = [
    {
      nom: "1 · Cartes services",
      cible: "concept",
      note: "Les trois étapes du concept en cartes arrondies, chacune cerclée de sa couleur (vert, bleu, lac) : les visages de Camille et Julie en haut à gauche, une flèche ↗ en haut à droite, le bouton « En savoir + » calé en bas. Au survol, la carte se soulève et s'allume.",
      css: `
        #concept .piliers { background: none; border: 0; gap: clamp(1rem, 2vw, 1.5rem); }
        #concept .pilier {
          --c: ${VERT};
          position: relative; display: flex; flex-direction: column;
          min-height: 340px; padding: 1.5rem 1.5rem 1.4rem;
          border: 1.5px solid var(--c); border-radius: 22px;
          background: #0f1f35;
          transition: transform .35s cubic-bezier(.22,.61,.36,1), box-shadow .35s ease !important;
        }
        #concept .pilier:nth-child(2) { --c: ${BLEU}; }
        #concept .pilier:nth-child(3) { --c: ${LAC}; }
        #concept .pilier:hover { transform: translateY(-6px); box-shadow: 0 0 0 1px var(--c), 0 0 28px color-mix(in srgb, var(--c) 40%, transparent); }
        #concept .pilier .pilier__rang { display: none; }
        #concept .mq-tete { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.6rem; color: var(--c); }
        #concept .mq-tete svg { transition: transform .35s ease !important; }
        #concept .pilier:hover .mq-tete svg { transform: translate(3px, -3px); }
        .mq-avatars { display: flex; }
        .mq-avatars img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--c); background: ${MARINE}; }
        .mq-avatars img + img { margin-left: -12px; }
        #concept .pilier__role { color: var(--c); }
        #concept .pilier h3 { font-size: clamp(1.35rem, 2.2vw, 1.6rem); }
        #concept .mq-pastille {
          margin-top: auto; align-self: flex-start;
          padding: .5rem 1rem; border-radius: 8px;
          background: ${CREME}; color: ${MARINE};
          font-family: var(--display); font-weight: 700; font-size: .9rem; text-decoration: none;
        }
        #concept .mq-pastille:hover { background: var(--c); }`,
      preparer(doc) {
        doc.querySelectorAll("#concept .pilier").forEach((p) => {
          p.insertAdjacentHTML("afterbegin", `<div class="mq-tete">${PORTRAITS}${FLECHE}</div>`);
          p.insertAdjacentHTML("beforeend", `<a class="mq-pastille" href="#formules">En savoir +</a>`);
        });
      },
    },
    {
      nom: "2 · Bento des chiffres",
      cible: "accompagnement",
      note: "Les chiffres à côté de « L'accompagnement scolaire » en mosaïque façon Blackmoon : la photo des bureaux en grand, une carte verte « +500 ados orientés » avec sa grande flèche, une carte « 100 % de parents satisfaits » et une barre de repères en bas.",
      css: `
        #accompagnement .chiffres { display: none; }
        .mq-bento {
          display: grid; gap: 14px;
          grid-template-columns: 1fr 1fr;
          grid-template-areas: "vert photo" "parents photo" "barre barre";
          align-self: center;
        }
        .mq-bento > * { border-radius: 22px; overflow: hidden; position: relative; }
        .mq-photo { grid-area: photo; min-height: 300px; }
        .mq-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .mq-photo span {
          position: absolute; left: 14px; bottom: 14px; padding: .35rem .8rem; border-radius: 8px;
          background: ${CREME}; color: ${MARINE}; font: 700 .8rem var(--display);
        }
        .mq-vert { grid-area: vert; background: ${VERT}; color: ${MARINE}; padding: 1.1rem 1.2rem 1.2rem; display: flex; flex-direction: column; min-height: 210px; }
        .mq-vert .mq-haut { display: flex; justify-content: space-between; align-items: center; }
        .mq-etiquette { padding: .3rem .7rem; border-radius: 7px; background: ${CREME}; font: 700 .72rem var(--display); letter-spacing: .06em; text-transform: uppercase; }
        .mq-vert .mq-gros { margin-top: auto; font: 800 clamp(2.6rem, 4.5vw, 3.4rem)/1 var(--display); letter-spacing: -.02em; }
        .mq-vert p { margin: .35rem 0 0; font: 600 .95rem/1.25 var(--display); position: relative; }
        .mq-vert .mq-decor { position: absolute; right: -30px; bottom: -40px; width: 190px; height: 190px; color: rgba(255,255,255,.28); pointer-events: none; }
        .mq-parents { grid-area: parents; border: 1.5px solid rgba(232,240,251,.22); padding: 1.1rem 1.2rem; display: flex; flex-direction: column; justify-content: center; gap: .3rem; }
        .mq-parents .mq-gros { font: 800 2.4rem/1 var(--display); color: var(--ink); }
        .mq-etoiles { color: ${VERT}; letter-spacing: .15em; font-size: 1.05rem; }
        .mq-parents p { margin: 0; color: var(--ink-soft); font: 600 .9rem var(--display); }
        .mq-barre { grid-area: barre; border: 1.5px solid rgba(232,240,251,.22); display: grid; grid-template-columns: repeat(3, 1fr); padding: 1rem .5rem; text-align: center; }
        .mq-barre div + div { border-left: 1px solid rgba(232,240,251,.22); }
        .mq-barre strong { display: block; font: 800 1.9rem/1.05 var(--display); color: var(--ink); }
        .mq-barre span { display: block; margin-top: .25rem; color: var(--ink-soft); font: 600 .8rem/1.25 var(--display); }
        @media (max-width: 560px) {
          .mq-bento { grid-template-columns: 1fr; grid-template-areas: "photo" "vert" "parents" "barre"; }
          .mq-photo { min-height: 220px; }
        }`,
      preparer(doc) {
        doc.querySelector("#accompagnement .chiffres").insertAdjacentHTML("afterend", `
          <div class="mq-bento">
            <div class="mq-photo"><img src="assets/img/bureaux-map73-640.webp" alt=""><span>Le cabinet, Chambéry</span></div>
            <div class="mq-vert">
              <svg class="mq-decor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M8 5h11v11"/></svg>
              <div class="mq-haut"><span class="mq-etiquette">Références</span>${FLECHE}</div>
              <span class="mq-gros">+500</span>
              <p>ados orientés depuis l’ouverture</p>
            </div>
            <div class="mq-parents"><span class="mq-etoiles">★★★★★</span><span class="mq-gros">100 %</span><p>de parents satisfaits</p></div>
            <div class="mq-barre">
              <div><strong>100 %</strong><span>d’admission Parcoursup</span></div>
              <div><strong>2</strong><span>expertes de l’orientation</span></div>
              <div><strong>3<sup>e</sup>→T<sup>le</sup></strong><span>un suivi sur 4 ans</span></div>
            </div>
          </div>`);
      },
    },
    {
      nom: "3 · Étiquettes penchées",
      cible: "news",
      note: "Les cartes des MAP news en grandes cartes claires, arrondies, avec des étiquettes de couleur posées de travers comme des autocollants (repris des projets Blackmoon). Le titre passe en capitales ; au survol, les étiquettes se redressent.",
      css: `
        #news .news__liste { gap: clamp(1rem, 2vw, 1.5rem); }
        #news .news__carte {
          background: ${CREME} !important; color: ${MARINE};
          border-radius: 26px; padding: 1.6rem 1.5rem 1.5rem;
          gap: .7rem; align-content: start;
          transition: transform .35s cubic-bezier(.22,.61,.36,1) !important;
        }
        #news .news__carte:hover { transform: translateY(-5px); }
        #news .news__date { display: none; }
        #news .news__intitule { color: ${MARINE}; font-size: clamp(1.25rem, 2vw, 1.5rem); text-transform: uppercase; letter-spacing: -.01em; line-height: 1.1; }
        #news .news__texte { color: #3a4659; }
        #news .news__lien { color: ${MARINE}; font-family: var(--display); font-weight: 700; }
        #news .news__portrait { border-radius: 50%; border: 2px solid ${VERT}; width: 56px; height: 56px; }
        .mq-etiquettes { display: flex; flex-wrap: wrap; gap: .35rem .2rem; margin: -.2rem 0 .5rem -.3rem; }
        .mq-etiquettes span {
          display: inline-block; padding: .4rem .85rem; border-radius: 9px;
          font: 700 .8rem var(--display); color: ${MARINE};
          transform: rotate(var(--r)); box-shadow: 0 2px 0 rgba(0,0,0,.08);
          transition: transform .35s cubic-bezier(.34,1.56,.64,1) !important;
        }
        #news .news__carte:hover .mq-etiquettes span { transform: rotate(0); }`,
      preparer(doc) {
        const lots = [
          [["Rentrée 2026", VERT, -7], ["Inscriptions", LAC, 9]],
          [["Nouveau", AMBRE, -5], ["En groupe", VERT, 6], ["Métiers", LAC, -3]],
          [["L’édito", VERT, 6], ["Parcoursup", "#f4c9a8", -6]],
        ];
        doc.querySelectorAll("#news .news__carte").forEach((carte, i) => {
          const lot = lots[i % lots.length];
          const html = `<div class="mq-etiquettes">${lot.map(([t, c, r]) => `<span style="background:${c};--r:${r}deg">${t}</span>`).join("")}</div>`;
          const portrait = carte.querySelector(".news__portrait");
          (portrait || carte.firstElementChild).insertAdjacentHTML(portrait ? "afterend" : "beforebegin", html);
        });
      },
    },
    {
      nom: "4 · Avis en éventail",
      cible: "temoignages",
      note: "Les témoignages en carrousel comme « Les avis de nos clients » : la carte du milieu, droite et verte, se lit en grand ; ses voisines, sombres et penchées, dépassent sur les côtés. Les flèches font tourner l'éventail ; un clic sur une carte voisine l'amène au centre.",
      css: `
        #temoignages { overflow: hidden; }
        #temoignages .temoignages {
          columns: auto; position: relative; height: 600px; margin-top: 1rem;
        }
        #temoignages .temoignage {
          --d: 0;
          position: absolute !important; left: 50%; top: 20px;
          width: min(340px, 76vw); min-height: 440px; margin: 0;
          padding: 1.6rem 1.5rem; border-radius: 24px;
          background: ${MARINE} !important; color: var(--ink);
          border: 1.5px solid rgba(232,240,251,.55);
          display: flex; flex-direction: column; gap: .9rem;
          transform: translateX(calc(-50% + var(--d) * 92%)) translateY(calc(var(--a) * 26px)) rotate(calc(var(--d) * 6deg));
          opacity: calc(1 - var(--a) * .25);
          z-index: calc(10 - var(--a));
          cursor: pointer;
          animation: none !important;
          transition: transform .6s cubic-bezier(.22,.61,.36,1), opacity .6s ease, background-color .4s ease, color .4s ease !important;
        }
        #temoignages .temoignage[data-loin] { opacity: 0; pointer-events: none; }
        #temoignages .temoignage::before, #temoignages .temoignage::after { display: none; }
        #temoignages .temoignage[data-actif] { background: ${VERT} !important; color: ${MARINE}; border-color: ${VERT}; cursor: default; box-shadow: 0 0 34px rgba(108,194,74,.35); }
        #temoignages .temoignage blockquote { margin: 0; }
        #temoignages .temoignage blockquote p { font-size: 1rem; line-height: 1.5; }
        #temoignages .temoignage figcaption { margin-top: auto; font-family: var(--display); font-weight: 700; color: inherit; }
        .mq-initiale {
          width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
          background: ${CREME}; color: ${MARINE}; font: 800 1.3rem var(--display);
        }
        .mq-nom { font: 800 1.35rem/1.1 var(--display); text-transform: uppercase; }
        .mq-fleches { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1rem; }
        .mq-fleches button {
          width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(232,240,251,.4);
          background: transparent; color: var(--ink); font-size: 1.3rem; cursor: pointer;
        }
        .mq-fleches button:hover { border-color: ${VERT}; color: ${VERT}; }
        @media (max-width: 560px) { #temoignages .temoignages { height: 640px; } }`,
      preparer(doc) {
        const liste = doc.getElementById("temoignages-liste");
        const cartes = [...liste.querySelectorAll(".temoignage")];
        cartes.forEach((c) => {
          const legende = c.querySelector("figcaption").textContent;
          const nom = legende.split(",")[0].replace(/^Maman d(e |’)/, "");
          c.insertAdjacentHTML("afterbegin", `<span class="mq-initiale">${nom.trim()[0]}</span><span class="mq-nom">${nom.trim()}</span>`);
        });
        let actif = 1;
        const n = cartes.length;
        const placer = () => cartes.forEach((c, i) => {
          let d = i - actif;
          if (d > n / 2) d -= n;
          if (d < -n / 2) d += n;
          c.style.setProperty("--d", d);
          c.style.setProperty("--a", Math.abs(d));
          c.toggleAttribute("data-actif", d === 0);
          c.toggleAttribute("data-loin", Math.abs(d) > 1);
        });
        cartes.forEach((c, i) => c.addEventListener("click", () => { actif = i; placer(); }));
        liste.insertAdjacentHTML("afterend", `<div class="mq-fleches"><button type="button" aria-label="Avis précédent">←</button><button type="button" aria-label="Avis suivant">→</button></div>`);
        const [prec, suiv] = liste.nextElementSibling.children;
        prec.addEventListener("click", () => { actif = (actif - 1 + n) % n; placer(); });
        suiv.addEventListener("click", () => { actif = (actif + 1) % n; placer(); });
        placer();
      },
    },
  ];

  const cadre = document.getElementById("site");
  const scene = document.getElementById("scene");
  const fiche = document.getElementById("fiche");
  const conteneur = document.getElementById("choix");
  const depart = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), DESIGNS.length) - 1;
  let courant = DESIGNS[depart];
  let avant = false;

  /* Le cadre reste cache pendant le chargement et la transformation. */
  function appliquer() {
    const doc = cadre.contentDocument;
    if (!doc || !doc.querySelector(".hero")) return;
    if (!avant) {
      const style = doc.createElement("style");
      style.textContent = courant.css;
      doc.head.appendChild(style);
      courant.preparer(doc);
    }
    const section = doc.getElementById(courant.cible);
    cadre.contentWindow.scrollTo(0, section.getBoundingClientRect().top + cadre.contentWindow.scrollY - 70);
    cadre.style.visibility = "visible";
  }

  function recharger() {
    cadre.style.visibility = "hidden";
    cadre.src = "index.html?mq=" + Date.now();
  }
  cadre.addEventListener("load", appliquer);

  function choisir(d) {
    courant = d;
    history.replaceState(null, "", "#" + (DESIGNS.indexOf(d) + 1));
    conteneur.querySelectorAll(".option").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.nom === d.nom)));
    fiche.innerHTML = `<strong>${d.nom}.</strong> ${d.note}`;
    recharger();
  }

  DESIGNS.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.dataset.nom = d.nom;
    b.textContent = d.nom;
    b.addEventListener("click", () => choisir(d));
    conteneur.appendChild(b);
  });

  const bascule = document.createElement("button");
  bascule.type = "button";
  bascule.className = "reglage";
  bascule.textContent = "Avant";
  bascule.setAttribute("aria-pressed", "false");
  bascule.addEventListener("click", () => {
    avant = !avant;
    bascule.setAttribute("aria-pressed", String(avant));
    recharger();
  });
  document.querySelector(".reglages").prepend(bascule);

  document.querySelectorAll("[data-largeur]").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-largeur]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      scene.classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
      recharger();
    });
  });

  choisir(courant);
</script>
</body>
</html>
