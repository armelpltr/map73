<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : hero futuriste</title>
<style>
  /* Maquette : la page d'accueil, chargee dans un cadre, avec cinq fonds de
     hero plus futuristes. Seul le fond du hero change ; le texte, les
     boutons et le reste de la page ne bougent pas. Chaque fond s'efface en
     bas du hero, pour ne pas recreer de limite avec la section suivante. */
  :root {
    --nuit: #050b16;
    --panneau: #12213c;
    --trait: #1b2c47;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
    --choisi: #6cc24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.5rem;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; }
  .choix { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .option {
    padding: 0.45rem 0.9rem;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .option:hover { border-color: var(--doux); }
  .option[aria-pressed="true"] { border-color: var(--choisi); }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }
  .fiche { width: 100%; margin: 0; color: var(--doux); font-size: 0.85rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }
  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--nuit); }
  .scene--mobile iframe { width: 390px; border-left: 1px solid var(--trait); border-right: 1px solid var(--trait); }
  @media (max-width: 700px) { .reglages { margin-left: 0; } }
</style>
</head>
<body>

<header class="barre">
  <h1>Cinq heros futuristes</h1>
  <div class="choix" id="choix"></div>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="index.html" title="Page d'accueil avec le fond de hero choisi"></iframe>
</div>

<script>
  /* Commun a tous : le calque se glisse sous le contenu du hero et
     s'efface sur son dernier quart. Les animations portent !important et
     une specificite plus forte que la regle « mouvement reduit » du site,
     pour qu'on les voie dans la maquette sur un poste qui les fige ; le
     site final, lui, les arretera pour ceux qui l'ont demande. */
  const COMMUN = `
    .hero .mq-fond {
      position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
    }
    .hero .mq-fond *, .hero .mq-fond *::before, .hero .mq-fond *::after,
    .hero .mq-anime, .hero .mq-anime::before, .hero .mq-anime::after {
      animation-duration: var(--d, 10s) !important;
      animation-iteration-count: infinite !important;
    }`;

  const DESIGNS = [
    {
      nom: "1 · Grille horizon",
      note: "Un sol quadrillé vert en perspective qui défile vers vous, sous une ligne d'horizon lumineuse. Le plus « rétro-futur » : l'idée d'un chemin qui avance.",
      html: `<div class="mq-horizon"></div><div class="mq-sol"></div>`,
      css: `
        .hero::after, .hero__lucioles { display: none; }
        .hero .mq-fond {
          -webkit-mask-image: linear-gradient(to bottom, #000 84%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 84%, transparent 100%);
        }
        .mq-sol {
          position: absolute; left: -50%; right: -50%; top: 50%; height: 120%;
          background-image:
            linear-gradient(rgba(108,194,74,.55) 1px, transparent 1px),
            linear-gradient(90deg, rgba(108,194,74,.55) 1px, transparent 1px);
          background-size: 64px 64px;
          transform: perspective(400px) rotateX(72deg);
          transform-origin: 50% 0;
          -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 25%);
          opacity: .5;
          --d: 2.4s;
          animation: mq-defile linear;
        }
        @keyframes mq-defile { to { background-position: 0 64px; } }
        .mq-horizon {
          position: absolute; left: 0; right: 0; top: 50%; height: 220px; transform: translateY(-50%);
          background: radial-gradient(50% 50% at 50% 50%, rgba(108,194,74,.22), transparent 70%);
        }`,
    },
    {
      nom: "2 · Aurore",
      note: "Trois nappes de lumière floues (vert, lac, bleu) qui dérivent lentement derrière le texte. Doux, premium, très « app moderne ».",
      html: `<span class="mq-nappe mq-n1"></span><span class="mq-nappe mq-n2"></span><span class="mq-nappe mq-n3"></span>`,
      css: `
        .hero__lucioles { display: none; }
        .mq-nappe { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .32; animation: mq-derive ease-in-out alternate; }
        .mq-n1 { width: 46vw; height: 46vw; left: -8%; top: 5%; background: #6cc24a; --d: 14s; }
        .mq-n2 { width: 40vw; height: 40vw; right: -6%; top: -15%; background: #2e8fd0; --d: 18s; animation-delay: -6s; }
        .mq-n3 { width: 34vw; height: 34vw; left: 38%; top: 30%; background: #3c4fd8; opacity: .22; --d: 22s; animation-delay: -3s; }
        @keyframes mq-derive {
          0%   { transform: translate(0, 0) scale(1); }
          50%  { transform: translate(6vw, 4vw) scale(1.12); }
          100% { transform: translate(-4vw, 2vw) scale(.92); }
        }`,
    },
    {
      nom: "3 · Constellation",
      note: "Un réseau de points verts qui dérivent et se relient quand ils se rapprochent ; la souris attire les liens. Image des chemins possibles, des connexions.",
      html: `<canvas class="mq-ciel"></canvas>`,
      css: `
        .hero::after, .hero__lucioles { display: none; }
        .mq-ciel { position: absolute; inset: 0; width: 100%; height: 100%; }`,
      script: constellation,
    },
    {
      nom: "4 · Radar",
      note: "Des anneaux concentriques derrière le choix de classe, balayés par un faisceau vert qui tourne. Met en scène le « En quelle classe est votre enfant ? ».",
      html: `<div class="mq-radar"><span class="mq-balai"></span></div>`,
      css: `
        .hero__lucioles { display: none; }
        .mq-radar {
          position: absolute; width: 980px; height: 980px; right: -240px; top: 50%; transform: translateY(-50%);
          border-radius: 50%;
          background:
            repeating-radial-gradient(circle, transparent 0 69px, rgba(116,198,234,.16) 69px 70px),
            linear-gradient(rgba(116,198,234,.10), rgba(116,198,234,.10)) 50% 0 / 1px 100% no-repeat,
            linear-gradient(rgba(116,198,234,.10), rgba(116,198,234,.10)) 0 50% / 100% 1px no-repeat;
          -webkit-mask-image: radial-gradient(circle, #000 40%, transparent 70%);
          mask-image: radial-gradient(circle, #000 40%, transparent 70%);
        }
        .mq-balai {
          position: absolute; inset: 0; border-radius: 50%;
          background: conic-gradient(from 0deg, rgba(108,194,74,.26), rgba(108,194,74,0) 80deg, transparent 360deg);
          --d: 7s;
          animation: mq-tour linear;
        }
        @keyframes mq-tour { to { transform: rotate(-360deg); } }
        @media (max-width: 900px) { .mq-radar { width: 640px; height: 640px; right: -260px; top: 30%; } }`,
    },
    {
      nom: "5 · Verre et néon",
      note: "Le choix de classe devient une carte en verre dépoli, cerclée d'un liseré vert/lac qui tourne ; une lueur suit la souris et « un avenir. » est balayé d'un reflet.",
      html: `<span class="mq-spot"></span>`,
      css: `
        .hero__lucioles { display: none; }
        .mq-spot {
          position: absolute; inset: 0;
          background: radial-gradient(420px circle at var(--mx, 70%) var(--my, 30%), rgba(108,194,74,.16), transparent 70%);
        }
        @property --mq-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
        .hero .hero__classe.mq-anime {
          position: relative;
          padding: 1.75rem;
          border-radius: 22px;
          background: rgba(31, 44, 63, .45);
          -webkit-backdrop-filter: blur(14px);
          backdrop-filter: blur(14px);
          box-shadow: 0 20px 60px rgba(0,0,0,.35);
          --d: 6s;
        }
        .hero .hero__classe.mq-anime::before {
          content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
          background: conic-gradient(from var(--mq-angle), #6cc24a, #74c6ea, transparent 40%, transparent 60%, #6cc24a);
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
          animation: mq-lisere linear; --d: 6s;
          pointer-events: none;
        }
        @keyframes mq-lisere { to { --mq-angle: 360deg; } }
        .hero .hero__accent.mq-anime {
          background: linear-gradient(100deg, #6cc24a 40%, #d8f5c8 50%, #6cc24a 60%) 0 0 / 300% 100%;
          -webkit-background-clip: text; background-clip: text; color: transparent;
          --d: 4s;
          animation: mq-reflet linear;
        }
        @keyframes mq-reflet { from { background-position: 100% 0; } to { background-position: 0 0; } }`,
      script: verreEtNeon,
    },
  ];

  /* La constellation : des points qui derivent, relies sous 140 px. */
  function constellation(doc, win, calque) {
    const toile = calque.querySelector("canvas");
    const ctx = toile.getContext("2d");
    const souris = { x: -999, y: -999 };
    let pts = [];
    function taille() {
      const r = calque.getBoundingClientRect();
      toile.width = r.width * win.devicePixelRatio;
      toile.height = r.height * win.devicePixelRatio;
      ctx.setTransform(win.devicePixelRatio, 0, 0, win.devicePixelRatio, 0, 0);
      const n = Math.round((r.width * r.height) / 14000);
      pts = Array.from({ length: n }, () => ({
        x: Math.random() * r.width, y: Math.random() * r.height,
        vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
      }));
    }
    taille();
    win.addEventListener("resize", taille);
    const hero = doc.querySelector(".hero");
    const suivre = (e) => { const r = calque.getBoundingClientRect(); souris.x = e.clientX - r.left; souris.y = e.clientY - r.top; };
    hero.addEventListener("pointermove", suivre);
    let fini = false;
    function image() {
      if (fini) return;
      const w = toile.width / win.devicePixelRatio, h = toile.height / win.devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
      }
      const tous = pts.concat([souris]);
      for (let i = 0; i < tous.length; i++) {
        for (let j = i + 1; j < tous.length; j++) {
          const a = tous[i], b = tous[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          const max = b === souris ? 200 : 140;
          if (d < max) {
            ctx.strokeStyle = `rgba(116,198,234,${(1 - d / max) * (b === souris ? 0.7 : 0.45)})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      ctx.fillStyle = "#6cc24a";
      for (const p of pts) { ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); }
      win.requestAnimationFrame(image);
    }
    image();
    return () => { fini = true; win.removeEventListener("resize", taille); hero.removeEventListener("pointermove", suivre); };
  }

  /* Verre et neon : la lueur suit la souris, et deux elements du site
     recoivent la classe qui porte leurs effets. */
  function verreEtNeon(doc, win, calque) {
    const hero = doc.querySelector(".hero");
    const cibles = doc.querySelectorAll(".hero__classe, .hero__accent");
    cibles.forEach((el) => el.classList.add("mq-anime"));
    const suivre = (e) => {
      const r = hero.getBoundingClientRect();
      calque.style.setProperty("--mx", `${e.clientX - r.left}px`);
      calque.style.setProperty("--my", `${e.clientY - r.top}px`);
    };
    hero.addEventListener("pointermove", suivre);
    return () => { cibles.forEach((el) => el.classList.remove("mq-anime")); hero.removeEventListener("pointermove", suivre); };
  }

  const cadre = document.getElementById("site");
  const scene = document.getElementById("scene");
  const fiche = document.getElementById("fiche");
  const conteneur = document.getElementById("choix");
  const depart = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), DESIGNS.length) - 1;
  let courant = DESIGNS[depart];
  let arreter = null;

  function peindre() {
    const doc = cadre.contentDocument;
    const win = cadre.contentWindow;
    const hero = doc && doc.querySelector(".hero");
    if (!hero) return;
    if (arreter) { arreter(); arreter = null; }
    let style = doc.getElementById("maquette-hero");
    if (!style) {
      style = doc.createElement("style");
      style.id = "maquette-hero";
      doc.head.appendChild(style);
    }
    style.textContent = COMMUN + courant.css;
    let calque = hero.querySelector(".mq-fond");
    if (calque) calque.remove();
    calque = doc.createElement("div");
    calque.className = "mq-fond";
    calque.setAttribute("aria-hidden", "true");
    calque.innerHTML = courant.html;
    hero.prepend(calque);
    if (courant.script) arreter = courant.script(doc, win, calque);
  }

  function choisir(d) {
    courant = d;
    history.replaceState(null, "", "#" + (DESIGNS.indexOf(d) + 1));
    conteneur.querySelectorAll(".option").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.nom === d.nom)));
    fiche.innerHTML = `<strong>${d.nom}.</strong> ${d.note}`;
    peindre();
  }

  DESIGNS.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.dataset.nom = d.nom;
    b.textContent = d.nom;
    b.addEventListener("click", () => choisir(d));
    conteneur.appendChild(b);
  });

  document.querySelectorAll("[data-largeur]").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-largeur]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      scene.classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
    });
  });

  cadre.addEventListener("load", () => { arreter = null; peindre(); });
  choisir(courant);
</script>
</body>
</html>
