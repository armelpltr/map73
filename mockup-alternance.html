<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : alternance des fonds</title>
<style>
  /* Maquette de travail, hors site : elle charge la vraie page d'accueil
     dans un cadre et n'en change que les fonds. Le hero reste celui de la
     tenue sombre ; ensuite les sections alternent blanc puis bleu nuit,
     jusqu'au pied de page. Le site en ligne n'est pas touche. */
  :root {
    --nuit: #050b16;
    --panneau: #12213c;
    --trait: #1b2c47;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem 1.5rem;
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; }
  .ordre { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin: 0; padding: 0; list-style: none; font-size: 0.85rem; color: var(--doux); }
  .ordre li { display: flex; align-items: center; gap: 0.35rem; }
  .ordre li + li::before { content: "→"; margin-right: 0.35rem; }
  .pastille { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #3a4b66; }
  .palettes { display: flex; flex-wrap: wrap; gap: 0.5rem; width: 100%; }
  .palette {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.75rem 0.35rem 0.35rem;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .palette:hover { border-color: var(--doux); }
  .palette[aria-pressed="true"] { border-color: #94c412; }
  .palette__duo { display: flex; border-radius: 50%; overflow: hidden; width: 26px; height: 26px; border: 1px solid #3a4b66; flex: none; }
  .palette__duo span { flex: 1; }
  .palette__nom { font-weight: 600; }
  .fiche { display: flex; flex-wrap: wrap; gap: 0.3rem 1.25rem; width: 100%; margin: 0; color: var(--doux); font-size: 0.8rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }
  .fiche .alerte { color: #e8a33d; font-weight: 600; }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }
  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .scene--mobile iframe { width: 390px; }
  @media (max-width: 700px) { .reglages { margin-left: 0; } }
</style>
</head>
<body>

<header class="barre">
  <h1>Alternance des fonds</h1>
  <ol class="ordre">
    <li><span class="pastille" style="background:#050b16"></span>Hero (inchangé)</li>
    <li><span class="pastille" id="ordre-clair"></span><span id="ordre-clair-nom">Clair</span></li>
    <li><span class="pastille" id="ordre-bleu"></span><span id="ordre-bleu-nom">Bleu</span></li>
    <li>et ainsi de suite</li>
  </ol>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <div class="palettes" id="palettes"></div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="index.html" title="Page d'accueil avec l'alternance des fonds"></iframe>
</div>

<script>
  const NUIT = "#050b16";   // le fond du hero en tenue sombre

  /* Chaque proposition donne trois teintes : le fond clair, les cartes posees
     sur ce fond (un cran a cote, sinon elles s'y fondent), et le bleu. Le
     texte reste celui du site : encre #14243b sur le clair, creme sur le
     bleu. Les liens du site (#2b759d) sont regles pour le blanc : sur un
     fond teinte ils tombent a 4,3 ; ces palettes les assombrissent un peu. */
  const PALETTES = [
    { nom: "Blanc et bleu nuit", clair: "#ffffff", carte: "#f7f6f1", bleu: "#14243b",
      note: "La première maquette : blanc franc, bleu nuit du site." },
    { nom: "Crème et marine", clair: "#fbf0d9", carte: "#fffaf0", bleu: "#0a1a3a", lien: "#22688c",
      note: "Crème franchement chaud, presque jaune paille, contre un marine saturé." },
    { nom: "Béton et ardoise", clair: "#e2e6ec", carte: "#f4f6f9", bleu: "#2e3d55", lien: "#22688c",
      note: "Gris froid et bleu ardoise clair : le plus sobre, le moins contrasté." },
    { nom: "Lavande et indigo", clair: "#efeafb", carte: "#faf8ff", bleu: "#221d52", lien: "#22688c",
      note: "Le bleu tire vers le violet : plus singulier, moins « institution »." },
    { nom: "Ciel et bleu roi", clair: "#e1eefa", carte: "#f5faff", bleu: "#0b3d7a", lien: "#22688c",
      note: "Bleu vif et lumineux : le plus énergique, le plus « école »." },
    { nom: "Sauge et canard", clair: "#e4efdc", carte: "#f5f9f1", bleu: "#063f4a", lien: "#22688c",
      note: "Vert pâle et bleu canard : nature, en écho au vert du logo." },
  ];

  /* La page part de la tenue claire, qui sait deja poser du texte sur le
     bleu nuit (section--encre) et sur le clair. Seul le hero repasse en
     tenue sombre : on lui redonne localement les jetons de la nuit et les
     trois effets qui n'existent qu'en sombre (halo, courbes, lucioles). */
  const CSS = `
    .bascule-theme { display: none !important; }
    /* Le pied est clair : le fond de page sous lui aussi. */
    body { background: var(--mq-clair); }

    .hero {
      color-scheme: dark;
      --paper: ${NUIT};
      --paper-2: #12213c;
      --ink: #e8f0fb;
      --ink-soft-page: #bac9de;
      --ink-soft: var(--ink-soft-page);
      --vert-texte-page: #94c412;
      --vert-texte: var(--vert-texte-page);
      --lac: #74c6ea;
      --trait: #1b2c47;
      --surface: #0d1929;
      --panneau: #12213c;
      --voile: rgba(232, 240, 251, 0.05);
      --grille: var(--trait);
      --lien: var(--lac);
      --lien-survol: var(--ink);
      background: ${NUIT};
      color: var(--ink);
    }
    .hero::before { opacity: 1 !important; }
    .hero__fond { color: var(--vert) !important; }
    .hero__lucioles { opacity: 1 !important; }

    /* Les sections claires : la tenue claire, posee sur le fond choisi.
       Les cartes qui reposaient sur --surface prennent la teinte « carte »,
       un cran a cote, sinon elles disparaitraient dans le fond. */
    .mq-blanc {
      --paper: var(--mq-clair);
      --surface: var(--mq-carte);
      --lac: var(--mq-lien);
      background: var(--mq-clair) !important;
    }
    .mq-bleu { --panneau: var(--mq-bleu); }
    .pied.mq-bleu { background: var(--mq-bleu); color: #f7f6f1; }
  `;

  const VAGUE = `
    <svg viewBox="0 0 600 54" preserveAspectRatio="none" focusable="false">
      <path class="remplissage" d="M0 30C120 8 240 46 360 30S540 4 600 20V54H0Z"/>
      <path class="niveau" d="M0 22C120 0 240 38 360 22S540 -4 600 12"/>
      <path class="niveau" d="M0 14C120 -8 240 30 360 14S540 -12 600 4"/>
    </svg>`;

  function transformer() {
    const doc = cadre.contentDocument;
    if (!doc || !doc.querySelector(".hero") || doc.getElementById("mq-style")) return;

    doc.documentElement.dataset.theme = "light";
    const style = doc.createElement("style");
    style.id = "mq-style";
    style.textContent = CSS;
    doc.head.appendChild(style);

    // Les vagues d'origine suivent l'ancienne alternance : on les retire et
    // on en repose une entre chaque bloc, aux couleurs de ses deux voisins.
    doc.querySelectorAll(".couture").forEach((c) => c.remove());

    const hero = doc.querySelector(".hero");
    const sections = [...doc.querySelectorAll("main > section:not(.hero)")];
    const pied = doc.querySelector(".pied");
    const blocs = [{ el: hero, fond: NUIT, ton: "nuit" }];

    [...sections, pied].forEach((el, i) => {
      const blanc = i % 2 === 0;
      el.classList.remove("section--encre", "section--craie", "mq-blanc", "mq-bleu");
      if (blanc) {
        el.classList.add("mq-blanc");
      } else {
        el.classList.add("mq-bleu");
        if (el !== pied) el.classList.add("section--encre");
      }
      blocs.push({ el, fond: blanc ? "var(--mq-clair)" : "var(--mq-bleu)", ton: blanc ? "clair" : "bleu" });
    });

    for (let i = 0; i < blocs.length - 1; i++) {
      const avant = blocs[i];
      const apres = blocs[i + 1];
      const vague = doc.createElement("div");
      vague.className = "couture" + (i % 2 ? " couture--miroir" : "");
      vague.setAttribute("aria-hidden", "true");
      // Les niveaux sont dessines dans la couleur du texte de la section
      // qui s'acheve, a faible intensite : creme sur le sombre, encre sur
      // le blanc.
      const niveau = avant.ton === "clair" ? "rgba(20, 36, 59, 0.22)" : "rgba(247, 246, 241, 0.24)";
      vague.style.cssText =
        `--couture-sortant:${avant.fond};--couture-entrant:${apres.fond};--couture-niveau:${niveau};`;
      vague.innerHTML = VAGUE;
      avant.el.after(vague);
    }
    peindre();
  }

  const lum = (hex) => {
    const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const contraste = (a, b) => {
    const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m);
    return (x + 0.05) / (y + 0.05);
  };
  // Sous 4,5, un petit texte ne passe pas le niveau AA : on le signale.
  const note = (a, b) => {
    const v = contraste(a, b);
    const t = v.toFixed(1).replace(".", ",");
    return v < 4.5 ? `<span class="alerte">${t}</span>` : `<strong>${t}</strong>`;
  };

  let palette;

  // Les teintes passent par trois variables posees sur la racine du cadre :
  // changer de proposition ne reconstruit rien, la cascade suit.
  function peindre() {
    const doc = cadre.contentDocument;
    if (doc && doc.documentElement) {
      const r = doc.documentElement.style;
      r.setProperty("--mq-clair", palette.clair);
      r.setProperty("--mq-carte", palette.carte);
      r.setProperty("--mq-bleu", palette.bleu);
      r.setProperty("--mq-lien", palette.lien || "#2b759d");
    }
    document.getElementById("ordre-clair").style.background = palette.clair;
    document.getElementById("ordre-bleu").style.background = palette.bleu;
    const [nomClair, nomBleu] = palette.nom.split(" et ");
    document.getElementById("ordre-clair-nom").textContent = nomClair;
    document.getElementById("ordre-bleu-nom").textContent = nomBleu[0].toUpperCase() + nomBleu.slice(1);
    document.querySelectorAll(".palette").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.nom === palette.nom)));
    document.getElementById("fiche").innerHTML =
      `<span><strong>${palette.clair} / ${palette.bleu}</strong> — ${palette.note}</span>` +
      `<span>Sur le clair : texte ${note("#14243b", palette.clair)}, texte doux ${note("#4a5872", palette.clair)}, liens ${note(palette.lien || "#2b759d", palette.clair)}</span>` +
      `<span>Sur le bleu : texte ${note("#f7f6f1", palette.bleu)}, texte doux ${note("#b9c3d4", palette.bleu)}, liens ${note("#79b8d8", palette.bleu)}, vert ${note("#94c412", palette.bleu)}</span>`;
  }

  const cadre = document.getElementById("site");

  const liste = document.getElementById("palettes");
  PALETTES.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "palette";
    b.dataset.nom = p.nom;
    b.innerHTML = `<span class="palette__duo"><span style="background:${p.clair}"></span><span style="background:${p.bleu}"></span></span>` +
      `<span class="palette__nom">${i}. ${p.nom}</span>`;
    b.addEventListener("click", () => { palette = p; peindre(); });
    liste.appendChild(b);
  });

  // mockup-alternance.html#2 ouvre directement sur la proposition 2.
  palette = PALETTES[Number(location.hash.slice(1))] || PALETTES[0];
  peindre();
  cadre.addEventListener("load", transformer);
  if (cadre.contentDocument && cadre.contentDocument.readyState === "complete") transformer();

  document.querySelectorAll(".reglage").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".reglage").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      document.getElementById("scene").classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
    });
  });
</script>
</body>
</html>
