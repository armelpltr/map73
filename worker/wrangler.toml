name = "map73-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Ce Worker existe pour une seule raison : la clé de service du projet
# Firebase ne peut pas vivre dans du JavaScript servi aux visiteurs. Il tient
# la porte du panel — contrôle anti-robot, appartenance à `admins`, mot de
# passe, puis code à six chiffres — et la gestion des accès.

[vars]
# Origine autorisée à appeler le Worker. À reprendre le jour du domaine
# définitif : une seule valeur, et le navigateur refuse tout le reste.
ALLOWED_ORIGIN = "https://armelpltr.github.io"

FIREBASE_PROJECT_ID = "map73-site"

# Clé web publique du projet, la même que dans assets/js/firebase-config.js.
# Elle sert ici à vérifier un mot de passe auprès d'Identity Toolkit. Elle
# n'a rien de secret : le navigateur l'envoie à chaque requête.
FIREBASE_API_KEY = "AIzaSyDkGrpEOrkIubBekppOi4ROaN8GF6wuqug"

# Expéditeur des codes de connexion. Doit être une adresse validée comme
# expéditeur chez Brevo (Senders → Add a sender → clic sur le lien reçu),
# sinon l'API accepte l'appel et le message n'arrive jamais.
EMAIL_EXPEDITEUR = "armel.plantier@gmail.com"
EMAIL_EXPEDITEUR_NOM = "MAP73"

# Secrets à injecter :
#
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
#     → JSON complet du compte de service (Console Firebase > Paramètres du
#       projet > Comptes de service > Générer une nouvelle clé privée)
#
#   npx wrangler secret put TURNSTILE_SECRET
#     → clé secrète du widget Turnstile (dash.cloudflare.com > Turnstile).
#       Sans elle, /connexion refuse tout le monde : mieux vaut un panel
#       injoignable qu'une porte sans serrure.
#
#   npx wrangler secret put BREVO_API_KEY
#     → clé API v3 de Brevo (SMTP & API > API Keys). Sans elle, aucun code
#       ne part, donc aucune connexion ne peut aboutir.
