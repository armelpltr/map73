<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : arrivée</title>
<style>
  /* Maquette : la page d'accueil, chargee dans un cadre, avec quatre
     arrivees dans la direction artistique du site. */
  :root {
    --nuit: #050b16;
    --panneau: #12213c;
    --trait: #1b2c47;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
    --choisi: #6cc24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.5rem;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; }
  .choix { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .option {
    padding: 0.45rem 0.9rem;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .option:hover { border-color: var(--doux); }
  .option[aria-pressed="true"] { border-color: var(--choisi); }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }
  .fiche { width: 100%; margin: 0; color: var(--doux); font-size: 0.85rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }
  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--nuit); }
  .scene--mobile iframe { width: 390px; border-left: 1px solid var(--trait); border-right: 1px solid var(--trait); }
  @media (max-width: 700px) { .reglages { margin-left: 0; } }
</style>
</head>
<body>

<header class="barre">
  <h1>Arrivée avec le logo</h1>
  <div class="choix" id="choix"></div>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="about:blank" title="Page d’accueil avec l’arrivée choisie"></iframe>
</div>

<script>
  /* Quatre arrivees dans la direction artistique du site : le marine de la
     page, sa lumiere bleue et verte, et ses trois motifs (le tube neon, la
     vague floue, le trait qui balaie). Le logo s'affiche d'abord en grand
     un court instant, puis l'animation decouvre la page. Tout passe par
     element.animate() ou un canevas : la maquette bouge meme sur un poste
     en « mouvement reduit ». */
  const MARINE = "#0b1a2e", VERT = "#6cc24a", VERT_COEUR = "#e2ffd6", BLEU = "#2f8cff", BLEU_COEUR = "#d6e9ff";
  const LOGO = "assets/img/logo-blanc-480.webp";
  const SORTIE = "cubic-bezier(.16,1,.3,1)";
  const RIDEAU = "cubic-bezier(.77,0,.175,1)";
  const PAUSE = 1450;
  const borne = (x) => Math.min(Math.max(x, 0), 1);
  const lisse = (x) => { x = borne(x); return x * x * (3 - 2 * x); };
  const glisse = (x) => { x = borne(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

  /* ---- Le premier temps, commun : le logo en grand ---- */

  /* Le voile reprend le fond du hero : le marine et la lumiere des deux
     neons. Le logo y entre en se posant, sa fleche s'allume. */
  function voile(doc) {
    const win = doc.defaultView;
    const largeur = Math.round(Math.min(560, win.innerWidth * 0.8));
    const v = doc.createElement("div");
    v.style.cssText = "position:fixed;inset:0;z-index:9999;pointer-events:none";
    v.innerHTML = `
      <div class="mq-fond" style="position:absolute;inset:0;background:
        radial-gradient(560px 380px at 74% 34%, rgba(47,140,255,.16), transparent 70%),
        radial-gradient(520px 300px at 26% 62%, rgba(108,194,74,.10), transparent 70%), ${MARINE}"></div>
      <img class="mq-logo" src="${LOGO}" alt="" style="position:absolute;left:50%;top:50%;width:${largeur}px;height:auto;transform:translate(-50%,-50%)">`;
    doc.body.appendChild(v);
    const logo = v.querySelector(".mq-logo");
    logo.animate([
      { opacity: 0, transform: "translate(-50%,-50%) scale(.94)", filter: "blur(10px)" },
      { opacity: 1, transform: "translate(-50%,-50%) scale(1)", filter: "blur(0)" },
    ], { duration: 900, easing: SORTIE, fill: "both" });
    /* La fleche verte s'allume : une lueur qui monte puis se pose. */
    logo.animate([
      { filter: "drop-shadow(0 0 0 rgba(108,194,74,0))" },
      { filter: "drop-shadow(0 0 18px rgba(108,194,74,.55))", offset: .5 },
      { filter: "drop-shadow(0 0 10px rgba(108,194,74,.35))" },
    ], { duration: 900, delay: 500, easing: "ease-out", fill: "forwards", composite: "add" });
    return { v, fond: v.querySelector(".mq-fond"), logo, largeur, win };
  }

  function cacherEnTete(doc) {
    const img = doc.querySelector(".entete__logo img");
    img.style.opacity = "0";
    return () => { img.style.opacity = ""; };
  }

  /* Le hero reste masque sous le voile, pour que le balayage le decouvre. */
  function figerHero(doc) {
    return [".hero h1", ".hero__chapo", ".hero__actions", ".hero__classe"].map((s) =>
      doc.querySelector(s).animate([{ clipPath: "inset(-20px 100% -20px -20px)" }, { clipPath: "inset(-20px 100% -20px -20px)" }], { duration: 1e6, fill: "both" }));
  }

  /* Le balayage neon du hero, tel qu'en ligne. */
  function balayerHero(doc, depart, gel) {
    gel.forEach((g) => g.cancel());
    [".hero h1", ".hero__chapo", ".hero__actions", ".hero__classe"].forEach((s, i) => {
      const bloc = doc.querySelector(s);
      if (doc.defaultView.getComputedStyle(bloc).position === "static") bloc.style.position = "relative";
      const trait = doc.createElement("span");
      trait.style.cssText = `position:absolute;top:-4px;bottom:-4px;left:0;width:2px;background:${VERT_COEUR};box-shadow:0 0 6px ${VERT},0 0 16px ${VERT},0 0 30px ${VERT};pointer-events:none;z-index:5;opacity:0`;
      bloc.appendChild(trait);
      const r = { duration: 1100, delay: depart + i * 200, easing: "cubic-bezier(.65,0,.35,1)", fill: "both" };
      const m = bloc.animate([{ clipPath: "inset(-20px 100% -20px -20px)" }, { clipPath: "inset(-20px -40px -20px -20px)" }], r);
      trait.animate([{ left: "0%", opacity: 0 }, { left: "0%", opacity: 1, offset: .05 }, { left: "100%", opacity: 1, offset: .95 }, { left: "100%", opacity: 0 }], r);
      m.onfinish = () => { m.cancel(); trait.remove(); };
    });
  }

  /* ---- Les quatre suites ---- */

  const DESIGNS = [
    {
      nom: "1 · Atterrissage",
      note: "Le logo s'affiche en grand sur le marine du site, sa flèche s'allume. Puis il rétrécit et glisse jusqu'à sa place dans l'en-tête ; comme le voile a la couleur de la page, celle-ci apparaît sans coupure autour de lui. À son arrivée, le liseré bleu-vert de l'en-tête se trace depuis le centre, et le balayage dévoile le hero.",
      jouer(doc) {
        const montrer = cacherEnTete(doc);
        const gel = figerHero(doc);
        const s = voile(doc);
        const cible = doc.querySelector(".entete__logo img").getBoundingClientRect();
        const dx = cible.left + cible.width / 2 - s.win.innerWidth / 2;
        const dy = cible.top + cible.height / 2 - s.win.innerHeight / 2;
        const k = cible.width / s.largeur;
        s.logo.animate([
          { transform: "translate(-50%,-50%)" },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${k})` },
        ], { duration: 1000, delay: PAUSE, easing: RIDEAU, fill: "forwards" }).onfinish = () => { montrer(); s.v.remove(); };
        s.fond.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 800, delay: PAUSE + 150, easing: "ease-in-out", fill: "forwards" });
        doc.querySelector(".entete").animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { pseudoElement: "::after", duration: 900, delay: PAUSE + 800, easing: SORTIE, fill: "both" });
        balayerHero(doc, PAUSE + 950, gel);
      },
    },
    {
      nom: "2 · Grand balayage",
      note: "Le logo en grand, puis le trait néon vert du site traverse tout l'écran de gauche à droite : le voile et le logo s'effacent dans son sillage et la page apparaît derrière lui. C'est le balayage des sections, à l'échelle de l'écran entier.",
      jouer(doc) {
        const montrer = cacherEnTete(doc);
        const s = voile(doc);
        const trait = doc.createElement("span");
        trait.style.cssText = `position:absolute;top:0;bottom:0;left:0;width:3px;background:${VERT_COEUR};box-shadow:0 0 8px ${VERT},0 0 22px ${VERT},0 0 50px ${VERT},0 0 90px rgba(108,194,74,.5);opacity:0`;
        s.v.appendChild(trait);
        const r = { duration: 1300, delay: PAUSE, easing: "cubic-bezier(.65,0,.35,1)", fill: "both" };
        trait.animate([{ left: "0%", opacity: 0 }, { left: "0%", opacity: 1, offset: .04 }, { left: "100%", opacity: 1, offset: .96 }, { left: "100%", opacity: 0 }], r);
        s.fond.animate([{ clipPath: "inset(0 0 0 0)" }, { clipPath: "inset(0 0 0 100%)" }], r);
        /* Le logo est centre : on le decoupe dans son propre repere, pour
           que le bord de la coupe reste colle au trait. */
        const box = s.logo.getBoundingClientRect();
        const W = s.win.innerWidth;
        s.logo.animate([
          { clipPath: `inset(-40px -40px -40px ${-box.left}px)` },
          { clipPath: `inset(-40px -40px -40px ${W - box.left}px)` },
        ], r).onfinish = () => { montrer(); s.v.remove(); };
        /* Le logo de l'en-tete apparait quand le trait passe sur lui. */
        const enTete = doc.querySelector(".entete__logo img");
        const passage = (enTete.getBoundingClientRect().left / W);
        s.win.setTimeout(montrer, PAUSE + 1300 * glisseInverse(passage));
      },
    },
    {
      nom: "3 · Vague",
      note: "Le logo en grand, puis les vagues néon floues du hero montent du bas de l'écran comme une marée : le voile se retire au-dessus d'elles et découvre la page, le logo s'efface sous la vague. Les vagues finissent leur course là où elles vivent, en bas du hero.",
      jouer(doc) {
        const montrer = cacherEnTete(doc);
        const gel = figerHero(doc);
        const s = voile(doc);
        const win = s.win;
        const W = win.innerWidth, H = win.innerHeight;
        const toile = doc.createElement("canvas");
        const dpr = Math.min(win.devicePixelRatio || 1, 2);
        toile.width = W * dpr;
        toile.height = H * dpr;
        toile.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
        s.v.appendChild(toile);
        const ctx = toile.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        /* La meme famille de courbes que les vagues du hero. */
        const tubes = [
          { c: "47,140,255", d: 0, a: 26, f: .0042, v: .6, p: 0 },
          { c: "108,194,74", d: 34, a: 30, f: .0035, v: -.45, p: 2 },
          { c: "47,140,255", d: 70, a: 22, f: .0055, v: .8, p: 4 },
        ];
        const courbe = (l, x, t, base) => base + l.d + l.a * Math.sin(x * l.f + t * l.v * 3 + l.p) + l.a * .45 * Math.sin(x * l.f * 2.3 - t * l.v * 4);
        let lance = false;
        const debut = win.performance.now();
        /* Pour les captures de verification : ?t=2.5 fige l'image. */
        const fige = parseFloat(new URLSearchParams(location.search).get("t"));
        const image = (maintenant) => {
          const t = Number.isNaN(fige) ? (maintenant - debut) / 1000 : fige;
          const u = glisse((t - PAUSE / 1000) / 1.5);
          /* Le bord de la vague monte du bas jusqu'au-dessus de l'ecran. */
          const base = H + 40 - u * (H + 260);
          ctx.clearRect(0, 0, W, H);
          if (u > 0) {
            s.fond.style.opacity = "0";
            s.logo.style.visibility = "hidden";
            /* Le voile, au-dessus de la vague. */
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(0, 0);
            for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, courbe(tubes[0], x, t, base) - 10);
            ctx.lineTo(W, 0);
            ctx.closePath();
            ctx.clip();
            ctx.fillStyle = MARINE;
            ctx.fillRect(0, 0, W, H);
            const g = ctx.createRadialGradient(W * .74, H * .34, 0, W * .74, H * .34, 480);
            g.addColorStop(0, "rgba(47,140,255,.16)");
            g.addColorStop(1, "rgba(47,140,255,0)");
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            const b = s.logo.getBoundingClientRect();
            ctx.drawImage(s.logo, b.left, b.top, b.width, b.height);
            ctx.restore();
            /* Les trois tubes, sur le bord. */
            for (const l of tubes) {
              ctx.beginPath();
              for (let x = -10; x <= W + 10; x += 6) {
                const y = courbe(l, x, t, base);
                x === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
              }
              /* Le halo en traits superposes, du plus large au coeur :
                 bien moins couteux qu'une ombre floue. */
              for (const [ep, al] of [[18, .1], [10, .22], [5, .55]]) {
                ctx.strokeStyle = `rgba(${l.c},${al})`;
                ctx.lineWidth = ep;
                ctx.stroke();
              }
              ctx.strokeStyle = "rgba(235,248,255,.7)";
              ctx.lineWidth = 1.8;
              ctx.stroke();
            }
            if (!lance && u > .35) { lance = true; balayerHero(doc, 0, gel); }
          }
          if (u >= 1) { montrer(); s.v.remove(); return; }
          if (!Number.isNaN(fige)) return;
          win.requestAnimationFrame(image);
        };
        win.requestAnimationFrame(image);
      },
    },
    {
      nom: "4 · Enseigne",
      note: "Le logo en grand, puis un tube néon bleu — celui de la carte « En quelle classe est votre enfant ? » — s'allume autour de lui en grésillant, comme une enseigne. Le fond s'efface à l'intérieur du cadre, qui s'agrandit jusqu'aux bords de l'écran et découvre la page.",
      jouer(doc) {
        const montrer = cacherEnTete(doc);
        const gel = figerHero(doc);
        const s = voile(doc);
        const W = s.win.innerWidth, H = s.win.innerHeight;
        const lw = s.largeur + 120, lh = Math.round(s.largeur * 0.41) + 110;
        s.fond.remove();
        const cadre = doc.createElement("div");
        const halo = `0 0 2px ${BLEU}, 0 0 8px ${BLEU}, 0 0 22px ${BLEU}, inset 0 0 14px rgba(47,140,255,.55)`;
        cadre.style.cssText = `position:absolute;left:50%;top:50%;width:${lw}px;height:${lh}px;transform:translate(-50%,-50%);border-radius:26px;
          border:2px solid ${BLEU_COEUR};box-shadow:${halo}, 0 0 0 200vmax ${MARINE};background:${MARINE}`;
        s.v.prepend(cadre);
        /* Le tube s'allume en grésillant : seuls le trait et le halo
           clignotent, le fond reste noir. */
        cadre.animate([
          { borderColor: "rgba(214,233,255,.05)", boxShadow: `0 0 0 transparent, 0 0 0 200vmax ${MARINE}` },
          { borderColor: "rgba(214,233,255,.05)", boxShadow: `0 0 0 transparent, 0 0 0 200vmax ${MARINE}`, offset: .3 },
          { borderColor: BLEU_COEUR, boxShadow: `${halo}, 0 0 0 200vmax ${MARINE}`, offset: .38 },
          { borderColor: "rgba(214,233,255,.1)", boxShadow: `0 0 0 transparent, 0 0 0 200vmax ${MARINE}`, offset: .45 },
          { borderColor: BLEU_COEUR, boxShadow: `${halo}, 0 0 0 200vmax ${MARINE}`, offset: .6 },
          { borderColor: "rgba(214,233,255,.3)", boxShadow: `0 0 0 transparent, 0 0 0 200vmax ${MARINE}`, offset: .66 },
          { borderColor: BLEU_COEUR, boxShadow: `${halo}, 0 0 0 200vmax ${MARINE}` },
        ], { duration: 1100, delay: 250, easing: "steps(1, end)", fill: "both" });
        /* L'interieur devient transparent : la page apparait dans le cadre. */
        cadre.animate([{ backgroundColor: MARINE }, { backgroundColor: "rgba(11,26,46,0)" }], { duration: 500, delay: PAUSE, easing: "ease-in", fill: "forwards" });
        s.logo.animate([{ opacity: 1 }, { opacity: 0, transform: "translate(-50%,-50%) scale(1.06)" }], { duration: 450, delay: PAUSE, easing: "ease-in", fill: "forwards" });
        cadre.animate([
          { width: `${lw}px`, height: `${lh}px`, borderRadius: "26px" },
          { width: `${W + 80}px`, height: `${H + 80}px`, borderRadius: "48px" },
        ], { duration: 1000, delay: PAUSE + 350, easing: RIDEAU, fill: "forwards" }).onfinish = () => { montrer(); s.v.remove(); };
        balayerHero(doc, PAUSE + 500, gel);
      },
    },
  ];

  /* L'instant ou un trait qui suit glisse() passe a la fraction p. */
  function glisseInverse(p) {
    let a = 0, b = 1;
    for (let i = 0; i < 20; i++) { const m = (a + b) / 2; glisse(m) < p ? (a = m) : (b = m); }
    return a;
  }

  const cadre = document.getElementById("site");
  const scene = document.getElementById("scene");
  const fiche = document.getElementById("fiche");
  const conteneur = document.getElementById("choix");
  const depart = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), DESIGNS.length) - 1;
  let courant = DESIGNS[depart];

  function lancer() {
    const doc = cadre.contentDocument;
    if (!doc || !doc.querySelector(".hero")) return;
    courant.jouer(doc);
    cadre.style.visibility = "visible";
  }
  function recharger() {
    cadre.style.visibility = "hidden";
    cadre.src = "index.html?mq=" + Date.now();
  }
  cadre.addEventListener("load", lancer);

  function choisir(d) {
    courant = d;
    history.replaceState(null, "", "#" + (DESIGNS.indexOf(d) + 1));
    conteneur.querySelectorAll(".option").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.nom === d.nom)));
    fiche.innerHTML = `<strong>${d.nom}.</strong> ${d.note} <em>« Rejouer » relance l'arrivée.</em>`;
    recharger();
  }

  DESIGNS.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.dataset.nom = d.nom;
    b.textContent = d.nom;
    b.addEventListener("click", () => choisir(d));
    conteneur.appendChild(b);
  });

  const rejouer = document.createElement("button");
  rejouer.type = "button";
  rejouer.className = "reglage";
  rejouer.textContent = "↻ Rejouer";
  rejouer.addEventListener("click", () => choisir(courant));
  document.querySelector(".reglages").prepend(rejouer);

  document.querySelectorAll("[data-largeur]").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-largeur]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      scene.classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
      choisir(courant);
    });
  });

  choisir(courant);
</script>
</body>
</html>
