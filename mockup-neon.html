<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : néon vert</title>
<style>
  /* Maquette : la page d'accueil, chargee dans un cadre, avec le neon
     vert de « un avenir. » etendu au reste du site, en deux dosages. */
  :root {
    --nuit: #050b16;
    --panneau: #12213c;
    --trait: #1b2c47;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
    --choisi: #6cc24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.5rem;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; }
  .choix { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .option {
    padding: 0.45rem 0.9rem;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .option:hover { border-color: var(--doux); }
  .option[aria-pressed="true"] { border-color: var(--choisi); }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }
  .fiche { width: 100%; margin: 0; color: var(--doux); font-size: 0.85rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }
  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--nuit); }
  .scene--mobile iframe { width: 390px; border-left: 1px solid var(--trait); border-right: 1px solid var(--trait); }
  @media (max-width: 700px) { .reglages { margin-left: 0; } }
</style>
</head>
<body>

<header class="barre">
  <h1>Le néon vert partout</h1>
  <div class="choix" id="choix"></div>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="index.html" title="Page d'accueil avec le néon vert étendu"></iframe>
</div>

<script>
  /* Le neon vert de « un avenir. » etendu au reste du site : onglets des
     formules, pictogrammes ronds, mots en vert des titres, chiffres,
     filets. Deux dosages a comparer a l'actuel. Faites defiler la page dans
     le cadre pour voir chaque section. */
  const VERT = "#6cc24a", COEUR = "#e2ffd6";
  const haloTube = `0 0 2px ${VERT}, 0 0 8px ${VERT}, 0 0 20px ${VERT}aa`;

  /* Commun aux deux dosages : tout ce qui n'est pas du texte. */
  const TUBES = `
    /* Les onglets des formules : l'onglet choisi devient un tube vert,
       les autres un tube eteint qui s'allume au survol. */
    .onglet-niveau { border-color: ${VERT}55; }
    .onglet-niveau:hover { border-color: ${VERT}; box-shadow: 0 0 10px ${VERT}66; color: var(--ink); }
    .onglet-niveau[aria-selected="true"] {
      background: rgba(108, 194, 74, .10);
      color: ${COEUR};
      border: 2px solid ${COEUR};
      box-shadow: ${haloTube}, inset 0 0 10px ${VERT}88;
      text-shadow: 0 0 6px ${VERT};
    }
    .onglet-niveau[aria-selected="true"] .onglet-niveau__puce {
      background: transparent; color: ${COEUR};
      border: 1.5px solid ${COEUR};
      box-shadow: 0 0 6px ${VERT}, inset 0 0 6px ${VERT}88;
    }

    /* Les pictogrammes ronds : un anneau de tube vert. */
    .chiffre__rond, .pilier__rang, .classe-choix__rond, .fondatrice__portrait {
      border-color: ${COEUR} !important;
      box-shadow: ${haloTube}, inset 0 0 10px ${VERT}88 !important;
    }
    .chiffre__rond svg, .classe-choix__rond svg { filter: drop-shadow(0 0 4px ${VERT}); }

    /* Les filets et traits verts : ils s'allument. */
    .hero__filet, .accompagnement__surtitre::before, .formules__hors-surtitre::before,
    .adn__tige, .adn__tige::before, .adn__filet, .nav__curseur, .temoignage::before, .pastille {
      box-shadow: 0 0 6px ${VERT}, 0 0 16px ${VERT}88 !important;
    }
    .adn__nom { box-shadow: 0 -6px 14px -6px ${VERT}; }
    .adn__arc { filter: drop-shadow(0 0 4px ${VERT}) drop-shadow(0 0 12px ${VERT}); }
    .temoignage::after { text-shadow: 0 0 8px ${VERT}, 0 0 20px ${VERT}; }`;

  /* Le texte vert, en lueur : le mot garde son remplissage. */
  const TEXTE_DOUX = `
    .accompagnement__titre em, .adn--arc .section-entete h2 em, .hero__classe-titre em,
    .modale-classe__titre em, .chiffre__valeur, .pilier__rang, .news__date,
    .formule__intitule, .adn__adage, .propos__acronyme b {
      text-shadow: 0 0 8px ${VERT}aa, 0 0 22px ${VERT}55;
    }`;

  /* Le texte vert en tube, comme « un avenir. » : au trait, sans
     remplissage, pour les titres et les grands chiffres seulement. Le
     petit texte garde la lueur, au trait il ne se lirait plus. */
  const TEXTE_FORT = TEXTE_DOUX + `
    .accompagnement__titre em, .adn--arc .section-entete h2 em, .chiffre__valeur {
      color: transparent !important; text-shadow: none;
      -webkit-text-stroke: 1.5px ${COEUR};
      filter: drop-shadow(0 0 2px ${VERT}) drop-shadow(0 0 7px ${VERT}) drop-shadow(0 0 16px ${VERT});
    }
    .bouton--plein { box-shadow: 0 0 10px ${VERT}88, 0 0 26px ${VERT}55; }`;

  const DESIGNS = [
    { nom: "1 · Actuel", css: "",
      note: "Le site tel qu'en ligne : le néon vert ne touche que « un avenir. »." },
    { nom: "2 · Néon doux", css: TUBES + TEXTE_DOUX,
      note: "Onglets des formules et pictogrammes ronds en tube néon vert, filets et traits allumés ; les mots en vert des titres et les chiffres gardent leur couleur pleine, avec une lueur autour." },
    { nom: "3 · Néon fort", css: TUBES + TEXTE_FORT,
      note: "Comme le doux, mais les mots en vert des titres (« MAP Orientation », « Orientation. ») et les grands chiffres passent au trait néon, exactement comme « un avenir. ». Les boutons verts rayonnent aussi." },
  ];

  const cadre = document.getElementById("site");
  const scene = document.getElementById("scene");
  const fiche = document.getElementById("fiche");
  const conteneur = document.getElementById("choix");
  const depart = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 2, 1), DESIGNS.length) - 1;
  let courant = DESIGNS[depart];

  function peindre() {
    const doc = cadre.contentDocument;
    if (!doc || !doc.head) return;
    let style = doc.getElementById("maquette-neon");
    if (!style) {
      style = doc.createElement("style");
      style.id = "maquette-neon";
      doc.head.appendChild(style);
    }
    style.textContent = courant.css;
  }

  function choisir(d) {
    courant = d;
    history.replaceState(null, "", "#" + (DESIGNS.indexOf(d) + 1));
    conteneur.querySelectorAll(".option").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.nom === d.nom)));
    fiche.innerHTML = `<strong>${d.nom}.</strong> ${d.note} <em>Faites défiler la page pour voir chaque section.</em>`;
    peindre();
  }

  DESIGNS.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.dataset.nom = d.nom;
    b.textContent = d.nom;
    b.addEventListener("click", () => choisir(d));
    conteneur.appendChild(b);
  });

  document.querySelectorAll("[data-largeur]").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-largeur]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      scene.classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
    });
  });

  cadre.addEventListener("load", peindre);
  choisir(courant);
</script>
</body>
</html>
