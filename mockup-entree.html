<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette : animations d'entrée</title>
<style>
  /* Maquette : la page d'accueil, chargee dans un cadre, avec cinq
     animations d'entree a comparer, inspirees de white-coffee.com. */
  :root {
    --nuit: #050b16;
    --panneau: #12213c;
    --trait: #1b2c47;
    --texte: #e8f0fb;
    --doux: #b9c3d4;
    --choisi: #6cc24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--nuit);
    color: var(--texte);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.5rem;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--trait);
    background: var(--panneau);
  }
  .barre h1 { margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; }
  .choix { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .option {
    padding: 0.45rem 0.9rem;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: transparent;
    color: var(--texte);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .option:hover { border-color: var(--doux); }
  .option[aria-pressed="true"] { border-color: var(--choisi); }
  .reglages { display: flex; gap: 0.5rem; margin-left: auto; }
  .reglage {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--trait);
    border-radius: 6px;
    background: transparent;
    color: var(--doux);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reglage[aria-pressed="true"] { color: var(--texte); border-color: var(--doux); }
  .fiche { width: 100%; margin: 0; color: var(--doux); font-size: 0.85rem; }
  .fiche strong { color: var(--texte); font-weight: 600; }
  .scene { flex: 1; display: flex; justify-content: center; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--nuit); }
  .scene--mobile iframe { width: 390px; border-left: 1px solid var(--trait); border-right: 1px solid var(--trait); }
  @media (max-width: 700px) { .reglages { margin-left: 0; } }
</style>
</head>
<body>

<header class="barre">
  <h1>Animations d'entrée</h1>
  <div class="choix" id="choix"></div>
  <div class="reglages">
    <button class="reglage" type="button" data-largeur="bureau" aria-pressed="true">Bureau</button>
    <button class="reglage" type="button" data-largeur="mobile" aria-pressed="false">Mobile</button>
  </div>
  <p class="fiche" id="fiche"></p>
</header>

<div class="scene" id="scene">
  <iframe id="site" src="about:blank" title="Page d’accueil animée"></iframe>
</div>

<script>
  /* Cinq animations d'entree : a l'ouverture de la page, puis a chaque
     section qui arrive a l'ecran. Tout passe par element.animate() : la
     regle « mouvement reduit » du site ne touche que les animations CSS,
     la maquette bouge donc meme sur un poste qui les fige. Le site final,
     lui, s'en passera pour ceux qui l'ont demande. « Rejouer » recharge la
     page dans le cadre. */
  const VERT = "#6cc24a", COEUR = "#e2ffd6", BLEU = "#2f8cff";
  const DOUX = "cubic-bezier(.25,.46,.45,.94)";
  const RIDEAU = "cubic-bezier(.77,0,.175,1)";
  const SORTIE = "cubic-bezier(.16,1,.3,1)";

  /* Les blocs qui entrent un par un, section par section. */
  const BLOCS = [
    ".section-entete > *", ".accompagnement__titre", ".accompagnement__surtitre", ".accompagnement__fait",
    ".chiffre", ".news__titre", ".news__carte", ".adn__pilier", ".adn__arc", ".propos__titre",
    ".propos__media", ".propos__acronyme", ".pilier", ".onglets-niveaux, .onglet-niveau", ".formule",
    ".fondatrice", ".temoignage", ".presse__article", ".billet", ".question", ".coordonnees__bloc", ".champ",
  ].join(",");
  const TITRES = ".section h2:not(.modale-classe__titre)";

  /* ---- Outils ---- */

  /* Coupe un titre en mots, chacun dans un masque : le mot peut monter
     depuis le bas sans deborder. Rend les mots, ranges par ligne. */
  function couperEnLignes(doc, el) {
    if (el.dataset.mqCoupe) return [];
    el.dataset.mqCoupe = "1";
    const mots = [];
    const marcher = (noeud) => {
      [...noeud.childNodes].forEach((n) => {
        if (n.nodeType === 1) return marcher(n);
        if (n.nodeType !== 3 || !n.textContent.trim()) return;
        const frag = doc.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach((morceau) => {
          if (!morceau) return;
          if (/^\s+$/.test(morceau)) return frag.appendChild(doc.createTextNode(morceau));
          const masque = doc.createElement("span");
          masque.style.cssText = "display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em";
          const mot = doc.createElement("span");
          mot.style.display = "inline-block";
          mot.textContent = morceau;
          masque.appendChild(mot);
          frag.appendChild(masque);
          mots.push(mot);
        });
        n.replaceWith(frag);
      });
    };
    marcher(el);
    const lignes = [];
    let haut = null;
    mots.forEach((m) => {
      const y = Math.round(m.parentNode.getBoundingClientRect().top);
      if (haut === null || Math.abs(y - haut) > 6) { lignes.push([]); haut = y; }
      lignes[lignes.length - 1].push(m);
    });
    return lignes;
  }

  /* Prepare une animation figee a son debut ; la section la jouera. */
  function preparer(el, images, options) {
    const a = el.animate(images, Object.assign({ fill: "both", easing: DOUX }, options));
    a.pause();
    return a;
  }

  /* Joue les animations d'un bloc quand il arrive a l'ecran. Un simple
     guet au defilement : plus previsible ici qu'un IntersectionObserver
     dans un cadre. */
  let guet = [];
  function aLEcran(win, el, jouer) {
    guet.push({ el, jouer });
    /* Le drapeau va sur le document : la fenetre du cadre, elle, peut
       survivre d'une page a l'autre. */
    const doc = el.ownerDocument;
    if (!doc.mqGuet) {
      doc.mqGuet = true;
      win = doc.defaultView;
      const verifier = () => {
        const bas = win.innerHeight * 0.88;
        guet = guet.filter((g) => {
          const r = g.el.getBoundingClientRect();
          if (r.top < bas && r.bottom > 0) { g.jouer(); return false; }
          return true;
        });
      };
      win.addEventListener("scroll", verifier, { passive: true });
      win.addEventListener("resize", verifier);
      win.setTimeout(verifier, 50);
      /* Filet de securite si un defilement passe sans evenement. */
      win.setInterval(verifier, 300);
    }
  }

  /* Les chiffres comptent depuis zero. */
  function compter(win, el, duree, delai) {
    const brut = el.textContent;
    const cible = parseInt(brut.replace(/\D/g, ""), 10);
    if (!cible) return;
    const debut = performance.now() + (delai || 0);
    el.textContent = brut.replace(/\d+/, "0");
    const pas = (t) => {
      const k = Math.min(Math.max((t - debut) / duree, 0), 1);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = brut.replace(/\d+/, String(Math.round(cible * e)));
      if (k < 1) win.requestAnimationFrame(pas);
    };
    win.requestAnimationFrame(pas);
  }

  /* Un groupe d'elements qui entrent ensemble, les uns apres les autres. */
  function groupes(doc, win, images, options, decalage) {
    const vus = new Set();
    doc.querySelectorAll(".section").forEach((section) => {
      const liste = [...section.querySelectorAll(BLOCS)].filter((el) => !vus.has(el) && !el.closest(".modale-classe"));
      liste.forEach((el) => vus.add(el));
      /* Par paquets : ce qui est sur la meme rangee entre ensemble. */
      liste.forEach((el) => {
        const a = preparer(el, images(el), options);
        aLEcran(win, el, () => {
          const rang = [...el.parentNode.children].indexOf(el) % 4;
          a.currentTime = -rang * decalage;
          a.play();
        });
      });
    });
  }

  function titresMasques(doc, win, duree) {
    doc.querySelectorAll(TITRES).forEach((h) => {
      const lignes = couperEnLignes(doc, h);
      const anims = [];
      lignes.forEach((ligne, i) => ligne.forEach((mot, j) => {
        anims.push(preparer(mot, [{ transform: "translateY(105%)" }, { transform: "translateY(0)" }],
          { duration: duree, delay: i * 110 + j * 25, easing: SORTIE }));
      }));
      aLEcran(win, h, () => anims.forEach((a) => a.play()));
    });
  }

  function chiffresQuiComptent(doc, win) {
    doc.querySelectorAll(".chiffre__valeur, .fondatrice__valeur").forEach((el) => {
      aLEcran(win, el, () => compter(win, el, 1600, 200));
    });
  }

  /* Le hero : titre mot a mot, puis le reste. */
  function heroMasque(doc, depart) {
    const h1 = doc.querySelector(".hero h1");
    couperEnLignes(doc, h1).forEach((ligne, i) => ligne.forEach((mot, j) => {
      mot.animate([{ transform: "translateY(110%)" }, { transform: "translateY(0)" }],
        { duration: 1100, delay: depart + i * 140 + j * 30, easing: SORTIE, fill: "both" });
    }));
  }
  function heroSuite(doc, depart, images, pas) {
    [".hero__filet", ".hero__chapo", ".hero__actions", ".hero__classe", ".entete"].forEach((s, i) => {
      const el = doc.querySelector(s);
      if (el) el.animate(images, { duration: 1000, delay: depart + i * (pas || 120), easing: SORTIE, fill: "both" });
    });
  }

  /* ---- Les cinq propositions ---- */

  const DESIGNS = [
    {
      nom: "1 · Rideau",
      note: "Comme White Coffee entre deux pages : un rideau marine, le logo au milieu et un liseré néon, se lève d'un coup sec. Le titre monte ensuite mot à mot depuis un masque ; en défilant, chaque titre de section fait pareil et les blocs remontent en fondu.",
      jouer(doc, win) {
        const rideau = doc.createElement("div");
        rideau.style.cssText = "position:fixed;inset:0;z-index:9999;background:#050b16;display:grid;place-items:center;pointer-events:none";
        rideau.innerHTML = `<div style="display:grid;justify-items:center;gap:22px">
          <img src="assets/img/logo-blanc-240.webp" width="180" alt="">
          <span style="display:block;height:2px;width:220px;background:${COEUR};box-shadow:0 0 6px ${VERT},0 0 18px ${VERT};transform-origin:left"></span></div>`;
        doc.body.appendChild(rideau);
        const [logo, trait] = rideau.firstElementChild.children;
        logo.animate([{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }], { duration: 600, easing: SORTIE, fill: "both" });
        trait.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 700, delay: 200, easing: RIDEAU, fill: "both" });
        rideau.animate([{ transform: "translateY(0)" }, { transform: "translateY(-100%)" }], { duration: 1000, delay: 1100, easing: RIDEAU, fill: "both" });
        heroMasque(doc, 1650);
        heroSuite(doc, 1850, [{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "none" }]);
        titresMasques(doc, win, 1000);
        groupes(doc, win, () => [{ opacity: 0, transform: "translateY(40px)" }, { opacity: 1, transform: "none" }], { duration: 900, easing: SORTIE }, 110);
        chiffresQuiComptent(doc, win);
      },
    },
    {
      nom: "2 · Éditorial",
      note: "Le cœur de White Coffee, sans rideau : les titres montent ligne par ligne depuis un masque, les photos se dévoilent de bas en haut en dézoomant (1,15 → 1), les cartes glissent en fondu, et les photos gardent ensuite un léger effet de profondeur au défilement.",
      jouer(doc, win) {
        heroMasque(doc, 150);
        heroSuite(doc, 450, [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "none" }]);
        titresMasques(doc, win, 1150);
        groupes(doc, win, () => [{ opacity: 0, transform: "translateY(50px)" }, { opacity: 1, transform: "none" }], { duration: 1000, easing: SORTIE }, 120);
        /* Les photos : un rideau de bas en haut, et l'image qui se pose. */
        const photos = [...doc.querySelectorAll(".propos__media img, .presse__article img, .news__portrait")];
        photos.forEach((img) => {
          const cadre = img.parentNode;
          const a = preparer(cadre, [{ clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 1200, easing: RIDEAU });
          const b = preparer(img, [{ transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 1800, easing: SORTIE });
          aLEcran(win, cadre, () => { a.play(); b.play(); });
        });
        /* La profondeur : la grande photo glisse moins vite que la page. */
        const grande = doc.querySelector(".propos__media img");
        if (grande) {
          grande.parentNode.style.overflow = "hidden";
          /* La boucle ne tourne que le temps de rattraper le defilement. */
          let lisse = 0, enCours = false;
          const boucle = () => {
            const r = grande.parentNode.getBoundingClientRect();
            const cible = ((r.top + r.height / 2) - win.innerHeight / 2) * -0.08;
            lisse += (cible - lisse) * 0.1;
            grande.style.translate = `0 ${lisse.toFixed(1)}px`;
            enCours = Math.abs(cible - lisse) > 0.2;
            if (enCours) win.requestAnimationFrame(boucle);
          };
          grande.style.scale = "1.12";
          win.addEventListener("scroll", () => { if (!enCours) { enCours = true; win.requestAnimationFrame(boucle); } }, { passive: true });
        }
        chiffresQuiComptent(doc, win);
      },
    },
    {
      nom: "3 · Allumage néon",
      note: "Dans le thème du site : la page s'ouvre dans le noir, les vagues montent, puis « un avenir. » et la carte bleue s'allument en grésillant comme un vrai tube. En défilant, les mots verts des titres, les ronds des pictogrammes et les chiffres s'allument à leur tour.",
      jouer(doc, win) {
        const gresille = [
          { opacity: 0, offset: 0 }, { opacity: 0.8, offset: 0.1 }, { opacity: 0.1, offset: 0.16 },
          { opacity: 0.9, offset: 0.3 }, { opacity: 0.25, offset: 0.36 }, { opacity: 1, offset: 0.5 },
          { opacity: 0.6, offset: 0.58 }, { opacity: 1, offset: 1 },
        ];
        const decor = doc.querySelector(".hero__decor");
        decor.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1800, easing: "ease-out", fill: "both" });
        const h1 = doc.querySelector(".hero h1");
        const accent = doc.querySelector(".hero__accent");
        h1.animate([{ opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0)" }], { duration: 900, delay: 300, easing: SORTIE, fill: "both" });
        accent.animate(gresille, { duration: 1400, delay: 1100, easing: "steps(1, end)", fill: "both" });
        doc.querySelector(".hero__classe").animate(gresille, { duration: 1300, delay: 1700, easing: "steps(1, end)", fill: "both" });
        [".hero__filet", ".hero__chapo", ".hero__actions", ".entete"].forEach((s, i) => {
          doc.querySelector(s).animate([{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }], { duration: 800, delay: 700 + i * 150, easing: SORTIE, fill: "both" });
        });
        groupes(doc, win, () => [{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "none" }], { duration: 800, easing: SORTIE }, 100);
        /* Les neons de la page s'allument a l'arrivee. */
        doc.querySelectorAll(".section h2 em, .chiffre__rond, .chiffre__valeur, .pilier__rang, .fondatrice__portrait, .onglet-niveau[aria-selected='true'], .adn__arc").forEach((el, i) => {
          const a = preparer(el, gresille, { duration: 1200, delay: 250 + (i % 3) * 180, easing: "steps(1, end)" });
          aLEcran(win, el, () => a.play());
        });
        chiffresQuiComptent(doc, win);
      },
    },
    {
      nom: "4 · Mise au point",
      note: "Le plus doux : chaque élément sort d'un flou, comme un objectif qui fait le point, en grossissant à peine. Le hero apparaît en cascade, les sections pareil en défilant, et les chiffres comptent depuis zéro.",
      jouer(doc, win) {
        const net = [{ opacity: 0, filter: "blur(14px)", transform: "scale(.96)" }, { opacity: 1, filter: "blur(0)", transform: "none" }];
        doc.querySelector(".hero__decor").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1600, fill: "both" });
        [".entete", ".hero__filet", ".hero h1", ".hero__chapo", ".hero__actions", ".hero__classe"].forEach((s, i) => {
          doc.querySelector(s).animate(net, { duration: 1100, delay: 150 + i * 140, easing: SORTIE, fill: "both" });
        });
        doc.querySelectorAll(TITRES).forEach((h) => {
          const a = preparer(h, net, { duration: 1100, easing: SORTIE });
          aLEcran(win, h, () => a.play());
        });
        groupes(doc, win, () => net, { duration: 1100, easing: SORTIE }, 130);
        chiffresQuiComptent(doc, win);
      },
    },
    {
      nom: "5 · Balayage",
      note: "Un trait néon vert traverse chaque bloc de gauche à droite et dévoile le contenu dans son sillage, comme un scanner. Au hero, le balayage passe sur toute la largeur ; en défilant, sur chaque titre et chaque carte.",
      jouer(doc, win) {
        const balayer = (el, delai, duree) => {
          const cs = win.getComputedStyle(el);
          if (cs.position === "static") el.style.position = "relative";
          const trait = doc.createElement("span");
          trait.setAttribute("aria-hidden", "true");
          trait.style.cssText = `position:absolute;top:-4px;bottom:-4px;left:0;width:2px;background:${COEUR};box-shadow:0 0 6px ${VERT},0 0 16px ${VERT},0 0 30px ${VERT};pointer-events:none;z-index:5;opacity:0`;
          el.appendChild(trait);
          const a = preparer(el, [{ clipPath: "inset(-20px 100% -20px -20px)" }, { clipPath: "inset(-20px -40px -20px -20px)" }], { duration: duree, delay: delai, easing: "cubic-bezier(.65,0,.35,1)" });
          const b = preparer(trait, [
            { left: "0%", opacity: 0 }, { left: "0%", opacity: 1, offset: 0.05 }, { left: "100%", opacity: 1, offset: 0.95 }, { left: "100%", opacity: 0 },
          ], { duration: duree, delay: delai, easing: "cubic-bezier(.65,0,.35,1)" });
          /* Fini, le masque s'en va : il couperait le halo des neons. */
          a.onfinish = () => a.cancel();
          return () => { a.play(); b.play(); };
        };
        [".hero h1", ".hero__chapo", ".hero__actions", ".hero__classe"].forEach((s, i) => balayer(doc.querySelector(s), 200 + i * 220, 1100)());
        doc.querySelector(".hero__decor").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1500, delay: 400, fill: "both" });
        doc.querySelector(".entete").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, fill: "both" });
        doc.querySelectorAll(TITRES).forEach((h) => {
          const jouer = balayer(h, 0, 1000);
          aLEcran(win, h, jouer);
        });
        doc.querySelectorAll(".chiffre, .news__carte, .adn__pilier, .pilier, .formule, .fondatrice, .temoignage, .presse__article, .billet").forEach((el) => {
          const rang = [...el.parentNode.children].indexOf(el) % 4;
          const jouer = balayer(el, rang * 140, 900);
          aLEcran(win, el, jouer);
        });
        chiffresQuiComptent(doc, win);
      },
    },
  ];

  const cadre = document.getElementById("site");
  const scene = document.getElementById("scene");
  const fiche = document.getElementById("fiche");
  const conteneur = document.getElementById("choix");
  const depart = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), DESIGNS.length) - 1;
  let courant = DESIGNS[depart];

  /* Le cadre reste cache pendant le chargement, pour ne pas voir l'etat
     final avant l'animation. */
  function lancer() {
    const doc = cadre.contentDocument;
    const win = cadre.contentWindow;
    if (!doc || !doc.querySelector(".hero")) return;
    guet = [];
    courant.jouer(doc, win);
    cadre.style.visibility = "visible";
  }

  function recharger() {
    cadre.style.visibility = "hidden";
    cadre.src = "index.html?mq=" + Date.now();
  }

  cadre.addEventListener("load", lancer);

  function choisir(d) {
    courant = d;
    history.replaceState(null, "", "#" + (DESIGNS.indexOf(d) + 1));
    conteneur.querySelectorAll(".option").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.nom === d.nom)));
    fiche.innerHTML = `<strong>${d.nom}.</strong> ${d.note} <em>Faites défiler la page pour voir les sections entrer ; « Rejouer » relance l'ouverture.</em>`;
    recharger();
  }

  DESIGNS.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.dataset.nom = d.nom;
    b.textContent = d.nom;
    b.addEventListener("click", () => choisir(d));
    conteneur.appendChild(b);
  });

  const rejouer = document.createElement("button");
  rejouer.type = "button";
  rejouer.className = "reglage";
  rejouer.textContent = "↻ Rejouer";
  rejouer.addEventListener("click", () => choisir(courant));
  document.querySelector(".reglages").prepend(rejouer);

  document.querySelectorAll("[data-largeur]").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-largeur]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      scene.classList.toggle("scene--mobile", b.dataset.largeur === "mobile");
      choisir(courant);
    });
  });

  choisir(courant);
</script>
</body>
</html>
